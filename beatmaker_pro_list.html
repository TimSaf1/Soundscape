<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soundscape | Beat Composer Pro — Мои биты</title>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e27;
      --bg-panel: #111530;
      --bg-cell: #1a1f3a;
      --accent: #00f3ff;
      --accent-dim: rgba(0, 243, 255, 0.15);
      --text: #ffffff;
      --text-muted: #8892b0;
      --border: #00f3ff;
      --danger: #ff0055;
      --success: #00ff88;
      --purple: #bc13fe;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      background: radial-gradient(ellipse at top, #1a1f3a 0%, #0a0e27 40%, #050714 100%);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #spaceCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.25; z-index: 0; pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px; background: radial-gradient(circle, #bc13fe 0%, transparent 70%);
      top: -100px; right: -100px; animation: float 20s ease-in-out infinite;
    }
    body::after {
      width: 600px; height: 600px; background: radial-gradient(circle, #00f3ff 0%, transparent 70%);
      bottom: -150px; left: -150px; animation: float 25s ease-in-out infinite reverse;
    }
    @keyframes float { 0%, 100% { transform: translate(-50px, -30px); } 50% { transform: translate(50px, 30px); } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.5), 0 0 60px rgba(188, 19, 254, 0.3), inset 0 0 20px rgba(255,255,255,0.1); }
      50% { box-shadow: 0 0 50px rgba(0, 243, 255, 0.8), 0 0 100px rgba(188, 19, 254, 0.5), inset 0 0 30px rgba(255,255,255,0.2); }
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position: 200% center; } }

    .header {
      position: relative; z-index: 10; background: rgba(0,0,0,0.5); padding: 15px 30px;
      border-bottom: 2px solid var(--border); backdrop-filter: blur(15px); animation: slideIn 0.6s;
    }
    .header-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
    .logo {
      font-size: 24px; font-weight: 800; letter-spacing: 1.5px;
      background: linear-gradient(90deg, var(--accent), var(--purple), #fff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon { font-size: 28px; animation: rotate 8s linear infinite; -webkit-text-fill-color: initial; text-fill-color: initial; }
    .btn-back {
      display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
      transition: all 0.2s; text-decoration: none; font-weight: 600;
    }
    .btn-back:hover { background: var(--accent-dim); color: var(--accent); transform: translateX(-3px); }

    .page-wrapper { position: relative; z-index: 5; max-width: 1400px; margin: 0 auto; padding: 40px 30px 150px; }
    .page-title {
      text-align: center; margin-bottom: 10px; font-size: 42px; font-weight: 800; letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent), var(--purple), #fff, var(--accent));
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }
    .page-subtitle { text-align: center; color: var(--text-muted); font-size: 15px; margin-bottom: 40px; letter-spacing: 1px; }

    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .project-card {
      position: relative; background: linear-gradient(135deg, rgba(17, 21, 48, 0.8), rgba(26, 31, 58, 0.6));
      border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 16px; padding: 20px;
      backdrop-filter: blur(15px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden; animation: slideIn 0.5s backwards;
    }
    .project-card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.1) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.4s; pointer-events: none;
    }
    .project-card:hover {
      transform: translateY(-6px); border-color: var(--accent);
      box-shadow: 0 20px 50px rgba(0, 243, 255, 0.2), 0 0 30px rgba(188, 19, 254, 0.15);
    }
    .project-card:hover::before { opacity: 1; }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; gap: 10px; }
    .card-title { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; word-break: break-word; }
    .card-planet { font-size: 22px; }
    .card-date { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 5px; }
    .card-stats { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
    .stat-chip {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); padding: 5px 10px;
      border-radius: 12px; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px;
    }
    .stat-chip b { color: var(--accent); font-weight: 700; }

    .card-wave { height: 40px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; gap: 2px; padding: 0 5px; }
    .wave-bar { flex: 1; background: linear-gradient(180deg, var(--accent), var(--purple)); border-radius: 2px; min-height: 3px; transition: transform 0.2s; }
    .project-card:hover .wave-bar { animation: wave 1.5s ease-in-out infinite; }
    @keyframes wave { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.4); } }

    .card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card-btn {
      padding: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3);
      color: var(--text); border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .card-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
    .card-btn.play { background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(188, 19, 254, 0.2)); border-color: var(--accent); }
    .card-btn.play:hover { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #000; }
    .card-btn.download { color: var(--success); }
    .card-btn.download:hover { background: rgba(0, 255, 136, 0.15); border-color: var(--success); }
    .card-btn.edit { color: var(--accent); }
    .card-btn.delete { color: var(--danger); }
    .card-btn.delete:hover { background: rgba(255, 0, 85, 0.15); border-color: var(--danger); }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; animation: float 6s ease-in-out infinite; }
    .empty-title { font-size: 22px; color: var(--text); margin-bottom: 10px; font-weight: 700; }
    .empty-text { font-size: 14px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

    .fab {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100;
      padding: 18px 40px; background: radial-gradient(circle at 30% 30%, #fff 0%, var(--accent) 30%, var(--purple) 70%, #5a00a0 100%);
      border: none; border-radius: 50px; color: #000; font-size: 16px; font-weight: 800; letter-spacing: 1px;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 10px;
      animation: pulseGlow 3s ease-in-out infinite; text-transform: uppercase; transition: all 0.3s ease;
    }
    .fab.hide-on-play { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(20px) scale(0.9); }
    .fab:hover { transform: translateX(-50%) scale(1.08); }
    .fab:active { transform: translateX(-50%) scale(0.95); }
    .fab-icon { font-size: 22px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.8)); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
    .modal.show { display: flex; animation: slideIn 0.3s; }
    .modal-content {
      background: linear-gradient(135deg, var(--bg-panel), var(--bg-cell)); border: 1px solid var(--accent);
      border-radius: 16px; padding: 30px; width: 400px; max-width: 90vw;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(0, 243, 255, 0.2);
    }
    .modal-title { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
    .modal-body { margin-bottom: 20px; color: var(--text); font-size: 14px; line-height: 1.6; }
    .modal-body input {
      width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15);
      color: white; border-radius: 8px; margin-top: 8px; font-size: 14px;
    }
    .modal-body input:focus { outline: none; border-color: var(--accent); }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-confirm { background: linear-gradient(90deg, var(--accent), var(--purple)); color: #000; }
    .btn-cancel { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn-danger { background: linear-gradient(90deg, var(--danger), #ff5500); color: #fff; }

    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 14, 39, 0.95);
      border-top: 2px solid var(--accent); padding: 15px 30px; z-index: 50;
      display: none; align-items: center; gap: 20px; backdrop-filter: blur(15px);
      box-shadow: 0 -10px 30px rgba(0, 243, 255, 0.15);
    }
    .player-bar.show { display: flex; }
    .player-info { display: flex; align-items: center; gap: 12px; min-width: 200px; }
    .player-icon {
      width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 20px; animation: rotate 4s linear infinite;
    }
    .player-title { font-weight: 700; font-size: 14px; }
    .player-subtitle { font-size: 11px; color: var(--text-muted); }
    .player-controls { display: flex; gap: 10px; align-items: center; }
    .player-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent);
      background: transparent; color: var(--accent); cursor: pointer; font-size: 16px; transition: all 0.2s;
    }
    .player-btn:hover { background: var(--accent); color: #000; }
    
    .player-progress {
      flex: 1; height: 20px; display: flex; align-items: center; position: relative;
    }
    #progress-bar {
      -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
      background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; cursor: pointer; transition: background 0.1s;
    }
    #progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px; background: var(--accent);
      border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px var(--accent); transition: transform 0.15s; margin-top: -5px;
    }
    #progress-bar::-webkit-slider-thumb:hover { transform: scale(1.3); box-shadow: 0 0 12px var(--accent); }
    #progress-bar::-moz-range-thumb {
      width: 14px; height: 14px; background: var(--accent); border: none; border-radius: 50%;
      cursor: pointer; box-shadow: 0 0 8px var(--accent); transition: transform 0.15s;
    }
    #progress-bar::-moz-range-thumb:hover { transform: scale(1.3); box-shadow: 0 0 12px var(--accent); }
    
    .player-time { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; }

    .notification {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(90deg, var(--accent), var(--purple)); color: #000;
      padding: 12px 28px; border-radius: 25px; font-weight: 700; font-size: 14px; z-index: 2000;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
    }
    .notification.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .page-title { font-size: 28px; }
      .fab { padding: 14px 28px; font-size: 14px; bottom: 25px; }
      .header { padding: 12px 15px; }
      .page-wrapper { padding: 20px 15px 120px; }
    }
  </style>
</head>
<body>

  <canvas id="spaceCanvas"></canvas>
  <div class="notification" id="notification">Уведомление</div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🪐</span>
        <span>SOUNDSCAPE</span>
      </div>
      <a href="index.html" class="btn-back"><span>← Назад на главную</span></a>
    </div>
  </header>

  <div class="page-wrapper">
    <h1 class="page-title">🎧 Мои биты</h1>
    <p class="page-subtitle">✨ Твоя музыкальная вселенная — каждый трек как планета ✨</p>
    <div id="projectsContainer" class="projects-grid"></div>
  </div>

  <a href="beatmaker_pro.html" class="fab" id="createBeatFab">
    <span class="fab-icon">✨</span>
    <span>Создать бит</span>
  </a>

  <div class="player-bar" id="playerBar">
    <div class="player-info">
      <div class="player-icon">🎵</div>
      <div>
        <div class="player-title" id="playerTitle">—</div>
        <div class="player-subtitle" id="playerSubtitle">Воспроизведение</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="playerPlayBtn" title="Play/Pause">▶</button>
      <button class="player-btn" id="playerStopBtn" title="Stop">⏹</button>
    </div>
    <div class="player-progress">
      <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
    </div>
    <div class="player-time" id="playerTime">0:00 / 0:00</div>
  </div>

  <div class="modal" id="deleteModal">
    <div class="modal-content">
      <div class="modal-title">🗑️ Удалить бит?</div>
      <div class="modal-body">Проект <b id="deleteProjectName"></b> будет удалён навсегда. Это действие нельзя отменить.</div>
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeDeleteModal()">Отмена</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">Удалить</button>
      </div>
    </div>
  </div>

  <div class="modal" id="renameModal">
    <div class="modal-content">
      <div class="modal-title">✏️ Переименовать</div>
      <div class="modal-body">
        <label>Новое название:</label>
        <input type="text" id="renameInput" maxlength="40" placeholder="Название бита...">
      </div>
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeRenameModal()">Отмена</button>
        <button class="btn btn-confirm" id="confirmRenameBtn">Сохранить</button>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'beatmaker_pro_projects';

  function loadProjects() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) { return []; }
  }

  function saveProjects(projects) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(projects)); } 
    catch (e) { showNotification('⚠️ Ошибка сохранения'); }
  }

  const canvas = document.getElementById('spaceCanvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }

  function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 6000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3, alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005,
        color: Math.random() > 0.85 ? '#00f3ff' : (Math.random() > 0.7 ? '#bc13fe' : '#ffffff')
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha += s.speed;
      const a = (Math.sin(s.alpha) + 1) / 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.globalAlpha = a * 0.9; ctx.fill();
      if (s.r > 1.2) { ctx.globalAlpha = a * 0.3; ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  drawStars();

  const container = document.getElementById('projectsContainer');
  let projects = loadProjects();
  let currentPlayingId = null, currentAudioBuffer = null, currentAudioSource = null;
  let playerStartTime = 0, playerPausedAt = 0, isPlayerPaused = false, playerAnimFrame = null;
  let isDraggingProgress = false;

  const planets = ['🌍', '🔴', '🌙', '🪐', '⭐', '☄️', '🌌', '🌠', '💫', '✨'];

  function getPlanet(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) & 0xffffffff;
    return planets[Math.abs(hash) % planets.length];
  }

  function countNotes(grid) {
    if (!grid) return 0;
    let count = 0;
    for (let t = 0; t < grid.length; t++)
      for (let s = 0; s < grid[t].length; s++)
        if (grid[t][s] && grid[t][s] !== 'occupied') count++;
    return count;
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function generateWaveBars(seed) {
    let hash = 0;
    for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) & 0xffffffff;
    const bars = [];
    for (let i = 0; i < 30; i++) {
      hash = (hash * 1103515245 + 12345) & 0x7fffffff;
      bars.push((hash % 100) / 100);
    }
    return bars;
  }

  function renderProjects() {
    container.innerHTML = '';
    if (projects.length === 0) {
      container.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-icon">🌌</div>
          <div class="empty-title">Твоя вселенная пуста</div>
          <div class="empty-text">Здесь будут отображаться все созданные тобой биты.<br>Нажми на кнопку ниже, чтобы создать свой первый трек!</div>
        </div>`;
      return;
    }
    const sorted = [...projects].sort((a, b) => b.createdAt - a.createdAt);
    sorted.forEach((proj, idx) => {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.style.animationDelay = `${idx * 0.05}s`;
      const noteCount = countNotes(proj.grid);
      const waveBars = generateWaveBars(proj.name);
      const planet = getPlanet(proj.name);
      card.innerHTML = `
        <div class="card-header">
          <div>
            <div class="card-title"><span class="card-planet">${planet}</span><span>${escapeHtml(proj.name)}</span></div>
            <div class="card-date">📅 ${formatDate(proj.createdAt)}</div>
          </div>
        </div>
        <div class="card-stats">
          <div class="stat-chip">🎵 <b>${noteCount}</b> нот</div>
          <div class="stat-chip">⏱️ <b>${proj.bpm || 120}</b> BPM</div>
          <div class="stat-chip">🎼 <b>${proj.duration || 0}</b> сек</div>
        </div>
        <div class="card-wave">${waveBars.map((h, i) => `<div class="wave-bar" style="height:${30 + h * 70}%; animation-delay:${i * 0.05}s"></div>`).join('')}</div>
        <div class="card-actions">
          <button class="card-btn play" data-action="play" data-id="${proj.id}">▶ Слушать</button>
          <button class="card-btn download" data-action="download" data-id="${proj.id}">💾 MP3</button>
          <button class="card-btn edit" data-action="edit" data-id="${proj.id}">✏️ Редактировать</button>
          <button class="card-btn delete" data-action="delete" data-id="${proj.id}">🗑️ Удалить</button>
        </div>`;
      container.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  container.addEventListener('click', (e) => {
    const btn = e.target.closest('.card-btn');
    if (!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    const proj = projects.find(p => p.id === id);
    if (!proj) return;
    if (action === 'play') playProject(proj);
    else if (action === 'download') downloadProject(proj);
    else if (action === 'edit') editProject(proj);
    else if (action === 'delete') openDeleteModal(proj);
  });

  let previewCtx = null;
  function getAudioContext() {
    if (!previewCtx) previewCtx = new (window.AudioContext || window.webkitAudioContext)();
    return previewCtx;
  }

  function makeDistortionCurve(amount) {
    const k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180;
    for (let i = 0; i < n; ++i) { const x = (i * 2) / n - 1; curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x)); }
    return curve;
  }

  function createImpulseResponse(duration, decay, ctx) {
    const rate = ctx.sampleRate, length = rate * duration;
    const impulse = ctx.createBuffer(2, length, rate);
    const L = impulse.getChannelData(0), R = impulse.getChannelData(1);
    for (let i = 0; i < length; i++) {
      const v = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
      L[i] = v; R[i] = v * (0.8 + Math.random() * 0.2);
    }
    return impulse;
  }

  function buildFxChain(ctx, source, fx, destination) {
    let node = source;
    if (fx.eq && (fx.eq.active || fx.eq.low !== 0 || fx.eq.mid !== 0 || fx.eq.high !== 0)) {
      const eqLow = ctx.createBiquadFilter(); eqLow.type = 'lowshelf'; eqLow.frequency.value = 100; eqLow.gain.value = fx.eq.low || 0;
      const eqMid = ctx.createBiquadFilter(); eqMid.type = 'peaking'; eqMid.frequency.value = 1000; eqMid.gain.value = fx.eq.mid || 0;
      const eqHigh = ctx.createBiquadFilter(); eqHigh.type = 'highshelf'; eqHigh.frequency.value = 5000; eqHigh.gain.value = fx.eq.high || 0;
      node.connect(eqLow); eqLow.connect(eqMid); eqMid.connect(eqHigh); node = eqHigh;
    }
    if (fx.distortion && fx.distortion.active) {
      const shaper = ctx.createWaveShaper(); shaper.curve = makeDistortionCurve(fx.distortion.drive || 20); shaper.oversample = '4x';
      const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = fx.distortion.tone || 2000;
      node.connect(shaper); shaper.connect(tone); node = tone;
    }
    if (fx.bitcrusher && fx.bitcrusher.active) {
      try {
        const crusher = ctx.createScriptProcessor(4096, 2, 2);
        const stepVal = Math.pow(0.5, fx.bitcrusher.bits || 8);
        const freqRed = fx.bitcrusher.freqReduction || 1;
        let phaser = 0, lastValue = 0;
        crusher.onaudioprocess = function(e) {
          const inL = e.inputBuffer.getChannelData(0), inR = e.inputBuffer.getChannelData(1);
          const outL = e.outputBuffer.getChannelData(0), outR = e.outputBuffer.getChannelData(1);
          for (let i = 0; i < inL.length; i++) {
            phaser += freqRed;
            if (phaser >= 1.0) { phaser = 0.0; lastValue = (inL[i] > 0 ? 1 : -1) * Math.floor(Math.abs(inL[i]) / stepVal + 0.5) * stepVal; }
            outL[i] = lastValue;
            outR[i] = (inR[i] > 0 ? 1 : -1) * Math.floor(Math.abs(inR[i]) / stepVal + 0.5) * stepVal;
          }
        };
        node.connect(crusher); node = crusher;
      } catch(e) {}
    }
    if (fx.compressor && fx.compressor.active) {
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = fx.compressor.threshold || -24; comp.ratio.value = fx.compressor.ratio || 4;
      node.connect(comp); node = comp;
    }
    if (fx.delay && fx.delay.active) {
      const delay = ctx.createDelay(2.0); delay.delayTime.value = fx.delay.time || 0.3;
      const fb = ctx.createGain(); fb.gain.value = (fx.delay.feedback || 40) / 100;
      const wet = ctx.createGain(); wet.gain.value = (fx.delay.mix || 30) / 100;
      node.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(destination);
    }
    if (fx.killer && fx.killer.active) {
      const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = fx.killer.freq || 200; hpf.Q.value = fx.killer.q || 1;
      node.connect(hpf); node = hpf;
    }
    if (fx.reverb && fx.reverb.active) {
      const conv = ctx.createConvolver(); conv.buffer = createImpulseResponse(fx.reverb.decay || 1.5, 2.0, ctx);
      const wet = ctx.createGain(); wet.gain.value = (fx.reverb.mix || 30) / 100;
      node.connect(conv); conv.connect(wet); wet.connect(destination);
    }
    const panner = ctx.createStereoPanner();
    panner.pan.value = (fx.panner ? fx.panner.pan : 0) / 100;
    node.connect(panner); node = panner;
    const gain = ctx.createGain(); gain.gain.value = 1.0;
    node.connect(gain); gain.connect(destination);
    return gain;
  }

  async function loadBufferFromUrl(url) {
    const ctx = getAudioContext();
    try {
      const r = await fetch(url);
      return await ctx.decodeAudioData(await r.arrayBuffer());
    } catch (e) { console.error('Failed to load:', url, e); return null; }
  }

  async function playProject(proj) {
    if (currentPlayingId === proj.id && !isPlayerPaused) { stopPlayer(); return; }
    stopPlayer();
    showNotification('🎵 Рендеринг бита...');
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') await ctx.resume();

    let maxStep = 0;
    const neededFiles = new Set();
    const grid = proj.grid;
    const bpm = proj.bpm || 120;
    // ИСПРАВЛЕНИЕ: учитываем, что теперь 1 шаг = 1/4 от четвертной ноты (4 суб-деления)
    const subStepDurationMs = ((60 / bpm) / 4 * 1000) / 4; 

    for (let t = 0; t < grid.length; t++) {
      for (let s = 0; s < grid[t].length; s++) {
        const n = grid[t][s];
        if (n && n !== 'occupied') {
          neededFiles.add(n.file);
          const end = s + n.duration;
          if (end > maxStep) maxStep = end;
        }
      }
    }

    if (neededFiles.size === 0) { showNotification('⚠️ В проекте нет нот'); return; }

    const buffers = new Map();
    await Promise.all(Array.from(neededFiles).map(async (file) => {
      const buf = await loadBufferFromUrl(file);
      if (buf) buffers.set(file, buf);
    }));

    const renderSteps = maxStep + 32;
    const sr = 44100;
    const totalDuration = renderSteps * subStepDurationMs / 1000;
    const offCtx = new OfflineAudioContext(2, Math.ceil(totalDuration * sr), sr);
    const master = offCtx.createGain();
    master.connect(offCtx.destination);

    for (let step = 0; step < renderSteps; step++) {
      const time = step * subStepDurationMs / 1000;
      for (let t = 0; t < grid.length; t++) {
        const note = grid[t][step];
        if (note && note !== 'occupied') {
          const buffer = buffers.get(note.file);
          if (!buffer) continue;
          const source = offCtx.createBufferSource();
          source.buffer = buffer;
          source.playbackRate.value = (note.speed || 1.0) * Math.pow(2, (note.pitch || 0) / 12);
          const gainNode = buildFxChain(offCtx, source, note.fx || {}, master);
          gainNode.gain.value = note.volume || 1.0;
          const trimStart = Math.max(0, note.fx?.trim?.start || 0);
          const trimEnd = Math.max(0, note.fx?.trim?.end || 0);
          const maxDur = Math.max(0.01, buffer.duration - trimStart - trimEnd);
          source.start(time, trimStart, maxDur);
        }
      }
    }

    const rendered = await offCtx.startRendering();
    currentAudioBuffer = rendered;
    currentPlayingId = proj.id;
    startBufferPlayback(proj.name, proj.bpm);
  }

  function startBufferPlayback(name, bpm) {
    document.getElementById('createBeatFab').classList.add('hide-on-play');
    const ctx = getAudioContext();
    const src = ctx.createBufferSource();
    src.buffer = currentAudioBuffer;
    src.connect(ctx.destination);
    src.start(0, playerPausedAt);
    currentAudioSource = src;
    playerStartTime = ctx.currentTime - playerPausedAt;
    isPlayerPaused = false;
    src.onended = () => { if (!isPlayerPaused) stopPlayer(); };

    const playerBar = document.getElementById('playerBar');
    playerBar.classList.add('show');
    document.getElementById('playerTitle').textContent = name;
    document.getElementById('playerSubtitle').textContent = `${bpm || 120} BPM`;
    document.getElementById('playerPlayBtn').textContent = '⏸';
    updatePlayerProgress();
  }

  function updatePlayerProgress() {
    if (!currentAudioBuffer || isDraggingProgress) return;
    const ctx = getAudioContext();
    const current = isPlayerPaused ? playerPausedAt : (ctx.currentTime - playerStartTime);
    updatePlayerProgressUI(current);
    if (!isPlayerPaused && current < currentAudioBuffer.duration) {
      playerAnimFrame = requestAnimationFrame(updatePlayerProgress);
    }
  }

  function updatePlayerProgressUI(currentTime) {
    if (!currentAudioBuffer) return;
    const total = currentAudioBuffer.duration;
    const pct = Math.min(100, (currentTime / total) * 100);
    const progressBar = document.getElementById('progress-bar');
    progressBar.value = pct;
    progressBar.style.background = `linear-gradient(to right, var(--accent) 0%, var(--purple) ${pct}%, rgba(255,255,255,0.1) ${pct}%, rgba(255,255,255,0.1) 100%)`;
    document.getElementById('playerTime').textContent = `${formatTime(currentTime)} / ${formatTime(total)}`;
  }

  function seekPlayer(percent) {
    if (!currentAudioBuffer) return;
    const newTime = (percent / 100) * currentAudioBuffer.duration;
    playerPausedAt = newTime;
    if (currentAudioSource) {
      try { currentAudioSource.stop(); } catch(e) {}
      currentAudioSource = null;
    }
    if (!isPlayerPaused) {
      const ctx = getAudioContext();
      const src = ctx.createBufferSource();
      src.buffer = currentAudioBuffer;
      src.connect(ctx.destination);
      src.start(0, playerPausedAt);
      currentAudioSource = src;
      playerStartTime = ctx.currentTime - playerPausedAt;
      src.onended = () => { if (!isPlayerPaused) stopPlayer(); };
    }
    updatePlayerProgressUI(newTime);
  }

  function togglePlayerPause() {
    if (!currentAudioBuffer) return;
    const ctx = getAudioContext();
    if (isPlayerPaused) {
      startBufferPlayback(document.getElementById('playerTitle').textContent, parseInt(document.getElementById('playerSubtitle').textContent));
    } else {
      playerPausedAt = ctx.currentTime - playerStartTime;
      if (currentAudioSource) { try { currentAudioSource.stop(); } catch(e) {} currentAudioSource = null; }
      isPlayerPaused = true;
      document.getElementById('playerPlayBtn').textContent = '▶';
      if (playerAnimFrame) cancelAnimationFrame(playerAnimFrame);
      updatePlayerProgress();
    }
  }

  function stopPlayer() {
    document.getElementById('createBeatFab').classList.remove('hide-on-play');
    if (currentAudioSource) { try { currentAudioSource.stop(); } catch(e) {} currentAudioSource = null; }
    if (playerAnimFrame) cancelAnimationFrame(playerAnimFrame);
    currentPlayingId = null;
    currentAudioBuffer = null;
    playerPausedAt = 0;
    isPlayerPaused = false;
    document.getElementById('playerBar').classList.remove('show');
    
    const pb = document.getElementById('progress-bar');
    pb.value = 0;
    pb.style.background = `linear-gradient(to right, var(--accent) 0%, var(--purple) 0%, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.1) 100%)`;
    document.getElementById('playerTime').textContent = `0:00 / 0:00`;
  }

  // === ЕДИНСТВЕННЫЙ БЛОК ОБРАБОТЧИКОВ ПОЛЗУНКА (Без дубликатов!) ===
  const progressBar = document.getElementById('progress-bar');
  
  progressBar.addEventListener('mousedown', () => { isDraggingProgress = true; });
  progressBar.addEventListener('touchstart', () => { isDraggingProgress = true; });

  progressBar.addEventListener('input', () => {
    if (!currentAudioBuffer) return;
    const previewTime = (progressBar.value / 100) * currentAudioBuffer.duration;
    progressBar.style.background = `linear-gradient(to right, var(--accent) 0%, var(--purple) ${progressBar.value}%, rgba(255,255,255,0.1) ${progressBar.value}%, rgba(255,255,255,0.1) 100%)`;
    document.getElementById('playerTime').textContent = `${formatTime(previewTime)} / ${formatTime(currentAudioBuffer.duration)}`;
  });

  progressBar.addEventListener('change', () => {
    if (!currentAudioBuffer) return;
    isDraggingProgress = false;
    seekPlayer(progressBar.value);
  });

  document.addEventListener('mouseup', () => {
    if (isDraggingProgress) { isDraggingProgress = false; seekPlayer(progressBar.value); }
  });
  
  document.addEventListener('touchend', () => {
    if (isDraggingProgress) { isDraggingProgress = false; seekPlayer(progressBar.value); }
  });
  // ================================================================

  document.getElementById('playerPlayBtn').addEventListener('click', togglePlayerPause);
  document.getElementById('playerStopBtn').addEventListener('click', stopPlayer);

  async function downloadProject(proj) {
    showNotification('💾 Рендеринг MP3...');
    const grid = proj.grid;
    const bpm = proj.bpm || 120;
    // ИСПРАВЛЕНИЕ: учитываем 4 суб-деления на четвертную ноту
    const subStepDurationMs = ((60 / bpm) / 4 * 1000) / 4; 
    let maxStep = 0;
    const neededFiles = new Set();
    for (let t = 0; t < grid.length; t++) {
      for (let s = 0; s < grid[t].length; s++) {
        const n = grid[t][s];
        if (n && n !== 'occupied') {
          neededFiles.add(n.file);
          const end = s + n.duration;
          if (end > maxStep) maxStep = end;
        }
      }
    }
    if (neededFiles.size === 0) { showNotification('⚠️ Нет нот'); return; }

    const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
    const buffers = new Map();
    await Promise.all(Array.from(neededFiles).map(async (file) => {
      try {
        const r = await fetch(file);
        const buf = await tempCtx.decodeAudioData(await r.arrayBuffer());
        buffers.set(file, buf);
      } catch(e) {}
    }));
    tempCtx.close();

    const renderSteps = maxStep + 64;
    const sr = 44100;
    const totalDuration = renderSteps * subStepDurationMs / 1000;
    const offCtx = new OfflineAudioContext(2, Math.ceil(totalDuration * sr), sr);
    const master = offCtx.createGain();
    master.connect(offCtx.destination);

    for (let step = 0; step < renderSteps; step++) {
      const time = step * subStepDurationMs / 1000;
      for (let t = 0; t < grid.length; t++) {
        const note = grid[t][step];
        if (note && note !== 'occupied') {
          const buffer = buffers.get(note.file);
          if (!buffer) continue;
          const source = offCtx.createBufferSource();
          source.buffer = buffer;
          source.playbackRate.value = (note.speed || 1.0) * Math.pow(2, (note.pitch || 0) / 12);
          const gainNode = buildFxChain(offCtx, source, note.fx || {}, master);
          gainNode.gain.value = note.volume || 1.0;
          const trimStart = Math.max(0, note.fx?.trim?.start || 0);
          const trimEnd = Math.max(0, note.fx?.trim?.end || 0);
          const maxDur = Math.max(0.01, buffer.duration - trimStart - trimEnd);
          source.start(time, trimStart, maxDur);
        }
      }
    }

    const rendered = await offCtx.startRendering();
    const enc = new lamejs.Mp3Encoder(2, sr, 320);
    const mp3 = [], bsz = 1152;
    const L = rendered.getChannelData(0), R = rendered.getChannelData(1);
    for (let i = 0; i < L.length; i += bsz) {
      const lc = L.subarray(i, i + bsz), rc = R.subarray(i, i + bsz);
      const li = new Int16Array(lc.length), ri = new Int16Array(rc.length);
      for (let j = 0; j < lc.length; j++) {
        li[j] = Math.max(-1, Math.min(1, lc[j])) * 0x7FFF;
        ri[j] = Math.max(-1, Math.min(1, rc[j])) * 0x7FFF;
      }
      const buf = enc.encodeBuffer(li, ri);
      if (buf.length) mp3.push(buf);
    }
    const end = enc.flush();
    if (end.length) mp3.push(end);

    const blob = new Blob(mp3, { type: 'audio/mp3' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${proj.name}_320kbps.mp3`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showNotification('✅ MP3 скачан!');
  }

  function editProject(proj) {
    sessionStorage.setItem('beatmaker_edit_id', proj.id);
    window.location.href = `beatmaker_pro.html?edit=${encodeURIComponent(proj.id)}`;
  }

  let deleteTargetId = null;
  function openDeleteModal(proj) {
    deleteTargetId = proj.id;
    document.getElementById('deleteProjectName').textContent = proj.name;
    document.getElementById('deleteModal').classList.add('show');
  }
  function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('show');
    deleteTargetId = null;
  }
  document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
    if (!deleteTargetId) return;
    projects = projects.filter(p => p.id !== deleteTargetId);
    saveProjects(projects);
    closeDeleteModal();
    renderProjects();
    showNotification('🗑️ Бит удалён');
  });

  let renameTargetId = null;
  container.addEventListener('dblclick', (e) => {
    const title = e.target.closest('.card-title');
    if (!title) return;
    const card = title.closest('.project-card');
    const btn = card.querySelector('[data-action="edit"]');
    if (!btn) return;
    renameTargetId = btn.dataset.id;
    const proj = projects.find(p => p.id === renameTargetId);
    if (!proj) return;
    document.getElementById('renameInput').value = proj.name;
    document.getElementById('renameModal').classList.add('show');
    setTimeout(() => document.getElementById('renameInput').focus(), 100);
  });

  function closeRenameModal() {
    document.getElementById('renameModal').classList.remove('show');
    renameTargetId = null;
  }

  document.getElementById('confirmRenameBtn').addEventListener('click', () => {
    if (!renameTargetId) return;
    const newName = document.getElementById('renameInput').value.trim();
    if (!newName) { showNotification('⚠️ Пустое имя'); return; }
    const proj = projects.find(p => p.id === renameTargetId);
    if (proj) {
      proj.name = newName;
      saveProjects(projects);
      renderProjects();
      showNotification('✅ Переименовано');
    }
    closeRenameModal();
  });

  document.getElementById('renameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('confirmRenameBtn').click();
    if (e.key === 'Escape') closeRenameModal();
  });

  function showNotification(msg) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 2500);
  }

  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_KEY) { projects = loadProjects(); renderProjects(); }
  });

  window.addEventListener('pageshow', () => {
    const fresh = loadProjects();
    if (JSON.stringify(fresh) !== JSON.stringify(projects)) { projects = fresh; renderProjects(); }
  });

  renderProjects();
</script>
