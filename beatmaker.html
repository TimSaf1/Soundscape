<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Maker Studio - Soundscape</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-bottom: 2px solid #bc13fe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #bc13fe, #00f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            padding: 8px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #00f3ff;
            border-radius: 20px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(0,243,255,0.3);
            transform: scale(1.05);
        }
        .container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .beatmaker-container {
            background: rgba(0,0,0,0.5);
            border: 2px solid #bc13fe;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
        }
        .beatmaker-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #bc13fe, #00f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .planet-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .planet-btn {
            padding: 12px 25px;
            border: 2px solid rgba(188,19,254,0.5);
            border-radius: 25px;
            background: rgba(188,19,254,0.2);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        .planet-btn.active {
            background: linear-gradient(90deg, #bc13fe, #00f3ff);
            border-color: #00f3ff;
            transform: scale(1.05);
        }
        .planet-genre {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .sound-library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .sound-category {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0,243,255,0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sound-category:hover {
            transform: translateY(-5px);
            border-color: #bc13fe;
            background: rgba(188,19,254,0.2);
        }
        .sound-category-icon { font-size: 40px; margin-bottom: 10px; }
        .sound-category-name { font-size: 14px; font-weight: bold; }
        .sequencer {
            display: grid;
            grid-template-columns: 100px repeat(16, 1fr);
            gap: 8px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding: 20px 0;
        }
        .seq-label {
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            padding: 5px;
        }
        .seq-step {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 35px;
        }
        .seq-step:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.1);
        }
        .seq-step.active {
            background: linear-gradient(135deg, #bc13fe, #00f3ff);
            border-color: #00f3ff;
            box-shadow: 0 0 15px rgba(0,243,255,0.5);
        }
        .seq-step.current {
            box-shadow: 0 0 20px #00f3ff;
            transform: scale(1.15);
        }
        .beatmaker-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn-primary {
            background: linear-gradient(90deg, #00f3ff, #bc13fe);
        }
        .bpm-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 12px 25px;
            border-radius: 12px;
        }
        .bpm-control button {
            background: #00f3ff;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s;
        }
        .bpm-control button:hover {
            transform: scale(1.1);
        }
        .neural-check {
            background: rgba(0,255,136,0.1);
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
            display: none;
        }
        .neural-check.active {
            display: block;
            animation: glow 2s infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,255,136,0.5); }
            50% { box-shadow: 0 0 40px rgba(0,255,136,0.8); }
        }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 16px;
        }
        .stat b { color: #ffd700; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"> Beat Maker Studio</div>
    <a href="index.html" class="back-btn">← Назад к играм</a>
</div>

<div class="container">
    <div class="stats-bar">
        <div class="stat">⭐ <b id="userXP">0</b> XP</div>
        <div class="stat"> <b id="userCoins">100</b></div>
    </div>

    <div class="beatmaker-container">
        <h2 class="beatmaker-title">🎹 Создай свой бит</h2>
        
        <div class="planet-selector">
            <button class="planet-btn active" onclick="selectPlanet('earth', event)">🌍 Земля</button>
            <button class="planet-btn" onclick="selectPlanet('mars', event)">🔴 Марс</button>
            <button class="planet-btn" onclick="selectPlanet('moon', event)">🌙 Луна</button>
        </div>
        <div class="planet-genre" id="planetGenre"> Жанр: Hip-Hop / Trap</div>

        <div class="sound-library" id="soundLibrary"></div>

        <div class="sequencer" id="sequencer"></div>

        <div class="beatmaker-controls">
            <button class="btn btn-primary" onclick="playBeat()">▶ Играть</button>
            <button class="btn" onclick="stopBeat()">⏹ Стоп</button>
            <button class="btn" onclick="clearBeat()">🗑 Очистить</button>
            <div class="bpm-control">
                <button onclick="changeBPM(-5)">-</button>
                <span id="bpmDisplay">120 BPM</span>
                <button onclick="changeBPM(5)">+</button>
            </div>
        </div>

        <button class="btn btn-primary" onclick="submitToNeural()" style="width:100%;padding:18px;font-size:16px;">🧠 Отправить на проверку нейросети</button>

        <div class="neural-check" id="neuralCheck">
            <h3 style="margin-bottom:20px;font-size:20px;">🧠 Нейросеть анализирует твой бит...</h3>
            <div style="font-size:60px;margin:30px 0;"></div>
            <p id="neuralStatus" style="margin-bottom:20px;font-size:16px;">Проверка ритма...</p>
            <div id="neuralResult" style="display:none;">
                <h2 style="color:#00ff88;margin-bottom:15px;font-size:28px;">✅ Бит одобрен!</h2>
                <p style="font-size:16px;margin-bottom:20px;">Твой бит соответствует требованиям планеты!</p>
                <p style="font-size:24px;color:#ffd700;">+500 XP + 200 🪙</p>
            </div>
        </div>
    </div>
</div>

<script>
let audioCtx = null;
let currentPlanet = 'earth';
let bpm = 120;
let sequencerSteps = 16;
let beatPattern = {};
let isPlaying = false;
let currentStep = 0;
let playInterval = null;

let userData = { xp: 0, coins: 100 };

const planetData = {
    earth: {
        genre: '🎵 Жанр: Hip-Hop / Trap',
        sounds: [
            { id: 'kick', name: '808 Kick', icon: '🥁', freq: 60, type: 'sine', duration: 0.5 },
            { id: 'snare', name: 'Snare', icon: '', freq: 200, type: 'triangle', duration: 0.15 },
            { id: 'hihat', name: 'Hi-Hat', icon: '🎩', freq: 8000, type: 'square', duration: 0.05 },
            { id: 'clap', name: 'Clap', icon: '👏', freq: 1500, type: 'sawtooth', duration: 0.1 },
            { id: 'bass', name: 'Bass 808', icon: '🎸', freq: 40, type: 'sine', duration: 0.4 }
        ]
    },
    mars: {
        genre: '🔥 Жанр: Techno / Industrial',
        sounds: [
            { id: 'kick', name: 'Industrial Kick', icon: '💥', freq: 80, type: 'square', duration: 0.4 },
            { id: 'snare', name: 'Metal Snare', icon: '⚙️', freq: 400, type: 'sawtooth', duration: 0.12 },
            { id: 'hihat', name: 'Acid Hi-Hat', icon: '', freq: 6000, type: 'square', duration: 0.03 },
            { id: 'clap', name: 'Noise Clap', icon: '🌪️', freq: 2000, type: 'sawtooth', duration: 0.08 },
            { id: 'bass', name: 'Synth Bass', icon: '🎛️', freq: 55, type: 'sawtooth', duration: 0.3 }
        ]
    },
    moon: {
        genre: '🌌 Жанр: Ambient / Chill',
        sounds: [
            { id: 'kick', name: 'Soft Kick', icon: '☁️', freq: 100, type: 'sine', duration: 0.6 },
            { id: 'snare', name: 'Warm Snare', icon: '🌊', freq: 300, type: 'sine', duration: 0.2 },
            { id: 'hihat', name: 'Shimmer Hat', icon: '✨', freq: 10000, type: 'sine', duration: 0.08 },
            { id: 'clap', name: 'Echo Clap', icon: '', freq: 800, type: 'sine', duration: 0.25 },
            { id: 'bass', name: 'Pad Bass', icon: '🌌', freq: 65, type: 'sine', duration: 0.8 }
        ]
    }
};

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(soundId) {
    initAudio();
    const sounds = planetData[currentPlanet].sounds;
    const sound = sounds.find(s => s.id === soundId);
    if (!sound) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = sound.type;
    osc.frequency.setValueAtTime(sound.freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + sound.duration);

    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + sound.duration);
}

window.onload = function() {
    loadData();
    updateStats();
    initSequencer();
};

function loadData() {
    const saved = localStorage.getItem('soundscape_v5');
    if (saved) {
        const data = JSON.parse(saved);
        userData = data.userData || userData;
    }
}

function saveData() {
    localStorage.setItem('soundscape_v5', JSON.stringify({ userData }));
}

function updateStats() {
    document.getElementById('userXP').textContent = userData.xp;
    document.getElementById('userCoins').textContent = userData.coins;
}

function initSequencer() {
    renderSoundLibrary();
    const seq = document.getElementById('sequencer');
    seq.innerHTML = '';
    
    const sounds = planetData[currentPlanet].sounds;
    beatPattern = {};
    
    sounds.forEach(sound => {
        beatPattern[sound.id] = new Array(sequencerSteps).fill(false);
        
        const label = document.createElement('div');
        label.className = 'seq-label';
        label.textContent = sound.name.toUpperCase();
        seq.appendChild(label);
        
        for (let i = 0; i < sequencerSteps; i++) {
            const step = document.createElement('div');
            step.className = 'seq-step';
            step.dataset.category = sound.id;
            step.dataset.step = i;
            step.onclick = () => toggleStep(sound.id, i, step);
            seq.appendChild(step);
        }
    });
}

function renderSoundLibrary() {
    const lib = document.getElementById('soundLibrary');
    lib.innerHTML = '';
    const sounds = planetData[currentPlanet].sounds;
    sounds.forEach(sound => {
        const div = document.createElement('div');
        div.className = 'sound-category';
        div.innerHTML = `<div class="sound-category-icon">${sound.icon}</div><div class="sound-category-name">${sound.name}</div>`;
        div.onclick = () => playSound(sound.id);
        lib.appendChild(div);
    });
}

function toggleStep(cat, step, element) {
    beatPattern[cat][step] = !beatPattern[cat][step];
    element.classList.toggle('active');
    if (beatPattern[cat][step]) playSound(cat);
}

function selectPlanet(planet, event) {
    currentPlanet = planet;
    document.querySelectorAll('.planet-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('planetGenre').textContent = planetData[planet].genre;
    initSequencer();
}

function playBeat() {
    if (isPlaying) return;
    isPlaying = true;
    currentStep = 0;
    const interval = (60 / bpm) * 1000 / 4;
    
    playInterval = setInterval(() => {
        document.querySelectorAll('.seq-step').forEach(s => s.classList.remove('current'));
        
        const sounds = planetData[currentPlanet].sounds;
        sounds.forEach(sound => {
            if (beatPattern[sound.id][currentStep]) playSound(sound.id);
            const step = document.querySelector(`.seq-step[data-category="${sound.id}"][data-step="${currentStep}"]`);
            if (step) step.classList.add('current');
        });
        
        currentStep = (currentStep + 1) % sequencerSteps;
    }, interval);
}

function stopBeat() {
    isPlaying = false;
    if (playInterval) clearInterval(playInterval);
    document.querySelectorAll('.seq-step').forEach(s => s.classList.remove('current'));
}

function clearBeat() {
    const sounds = planetData[currentPlanet].sounds;
    sounds.forEach(sound => {
        beatPattern[sound.id] = new Array(sequencerSteps).fill(false);
    });
    document.querySelectorAll('.seq-step').forEach(s => s.classList.remove('active'));
}

function changeBPM(delta) {
    bpm = Math.max(60, Math.min(200, bpm + delta));
    document.getElementById('bpmDisplay').textContent = bpm + ' BPM';
    if (isPlaying) { stopBeat(); playBeat(); }
}

function submitToNeural() {
    const neuralCheck = document.getElementById('neuralCheck');
    const neuralStatus = document.getElementById('neuralStatus');
    const neuralResult = document.getElementById('neuralResult');
    
    neuralCheck.classList.add('active');
    neuralResult.style.display = 'none';
    
    const steps = ['Анализ ритма...', 'Проверка гармонии...', 'Оценка креативности...', 'Сравнение с базой...', 'Финальная оценка...'];
    let step = 0;
    const interval = setInterval(() => {
        if (step < steps.length) {
            neuralStatus.textContent = steps[step];
            step++;
        } else {
            clearInterval(interval);
            neuralResult.style.display = 'block';
            userData.xp += 500;
            userData.coins += 200;
            saveData();
            updateStats();
        }
    }, 1000);
}
</script>
</body>
</html>
