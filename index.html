<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Soundscape - Музыкальная социальная сеть</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #ff006e;
            --tertiary: #8338ec;
            --dark: #0a0e27;
            --darker: #050810;
            --accent: #ffbe0b;
            --success: #06ffa5;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', 'Courier New', sans-serif;
            background: radial-gradient(ellipse at 20% 50%, rgba(3, 212, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                        linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            background-attachment: fixed;
            color: #fff;
        }

        /* ========== STARS BACKGROUND ========== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.1; }
        }

        /* ========== MAIN CONTAINER ========== */
        .app-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--dark) 0%, var(--darker) 100%);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .auth-screen.active {
            display: flex;
        }

        .auth-container {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0, 212, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .auth-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            box-shadow: 0 2px 15px rgba(0, 212, 255, 0.3);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        /* ========== MAIN APP ========== */
        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .app-container.visible {
            opacity: 1;
        }

        .header {
            background: rgba(10, 14, 39, 0.8);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            font-size: 1.5em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            background: rgba(0, 212, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            font-size: 0.85em;
        }

        .user-badge span {
            color: var(--primary);
            font-weight: bold;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 0, 110, 0.2);
            border: 1px solid var(--secondary);
            border-radius: 6px;
            color: var(--secondary);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 110, 0.3);
        }

        /* ========== TABS ========== */
        .nav-tabs {
            display: flex;
            gap: 0;
            background: rgba(10, 14, 39, 0.5);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            backdrop-filter: blur(10px);
            overflow-x: auto;
        }

        .nav-tab {
            flex: 1;
            min-width: 100px;
            padding: 15px;
            text-align: center;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .nav-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            box-shadow: 0 -2px 15px rgba(0, 212, 255, 0.3);
        }

        .nav-tab:hover {
            color: var(--primary);
        }

        /* ========== CONTENT ========== */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        .content-area {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== SEARCH ========== */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1em;
        }

        .search-input:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .search-btn, .upload-btn, .action-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .search-btn:hover, .upload-btn:hover, .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        /* ========== TRACKS GRID ========== */
        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .track-card {
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .track-card:hover {
            border-color: var(--primary);
            transform: translateY(-10px);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.3);
        }

        .track-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--tertiary), var(--secondary));
        }

        .track-info {
            padding: 15px;
        }

        .track-title {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .track-artist {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
        }

        .track-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .track-actions {
            display: flex;
            gap: 8px;
        }

        .track-btn {
            flex: 1;
            padding: 8px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid var(--primary);
            border-radius: 6px;
            color: var(--primary);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .track-btn:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .track-btn.active {
            background: var(--primary);
            color: var(--dark);
        }

        /* ========== CHARTS ========== */
        .chart-item {
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .chart-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .chart-rank {
            font-size: 2em;
            font-weight: bold;
            color: var(--accent);
            min-width: 50px;
        }

        .chart-cover {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--tertiary), var(--secondary));
        }

        .chart-details {
            flex: 1;
            min-width: 0;
        }

        .chart-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .chart-artist {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }

        .chart-plays {
            text-align: right;
        }

        .chart-plays-value {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.2em;
        }

        .chart-plays-label {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== PROFILE SECTION ========== */
        .profile-header {
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .profile-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            flex-shrink: 0;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .profile-info h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        /* ========== LEVEL SYSTEM ========== */
        .level-card {
            background: linear-gradient(135deg, rgba(131, 56, 236, 0.2), rgba(0, 212, 255, 0.2));
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .level-display {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .level-badge {
            background: linear-gradient(135deg, var(--tertiary), var(--secondary));
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: white;
        }

        .level-info h3 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        .level-info p {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ========== PLAYER ========== */
        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.95), rgba(5, 8, 16, 0.95));
            border-top: 2px solid var(--primary);
            padding: 15px 20px;
            z-index: 999;
            backdrop-filter: blur(10px);
            box-shadow: 0 -5px 30px rgba(0, 212, 255, 0.2);
        }

        .player-container.hidden {
            display: none;
        }

        .player-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .player-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-title {
            font-weight: bold;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
        }

        .player-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .progress-input {
            flex: 1;
            height: 4px;
            cursor: pointer;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .progress-input::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .time-display {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.6);
            min-width: 40px;
        }

        .player-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .player-btn {
            width: 40px;
            height: 40px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid var(--primary);
            border-radius: 50%;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .player-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            transform: scale(1.1);
        }

        .player-btn.play {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        /* ========== UPLOAD MODAL ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.9), rgba(5, 8, 16, 0.9));
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .modal-close {
            float: right;
            font-size: 2em;
            cursor: pointer;
            color: var(--secondary);
            background: none;
            border: none;
        }

        .modal-title {
            font-size: 1.5em;
            color: var(--primary);
            margin-bottom: 20px;
            clear: both;
        }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: var(--secondary);
            background: rgba(0, 212, 255, 0.1);
        }

        .upload-area.drag-over {
            border-color: var(--accent);
            background: rgba(255, 190, 11, 0.1);
        }

        .upload-input {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 0.95em;
        }

        .form-input:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--primary);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        /* ========== MESSAGES ========== */
        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        .message.error {
            background: rgba(255, 0, 110, 0.2);
            border-left: 4px solid var(--secondary);
        }

        .message.success {
            background: rgba(6, 255, 165, 0.2);
            border-left: 4px solid var(--success);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .player-inner {
                flex-wrap: wrap;
                gap: 10px;
            }

            .player-cover {
                width: 50px;
                height: 50px;
            }

            .tracks-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .player-progress {
                flex-basis: 100%;
                order: 3;
            }

            .nav-tab {
                font-size: 0.8em;
                padding: 12px 10px;
            }

            .auth-container {
                padding: 30px 20px;
                width: 95%;
            }
        }

        @media (max-width: 480px) {
            .content-wrapper {
                padding-bottom: 140px;
            }

            .tracks-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }

            .chart-item {
                padding: 10px;
                gap: 10px;
            }

            .chart-cover {
                width: 60px;
                height: 60px;
            }

            .player-btn {
                width: 35px;
                height: 35px;
                font-size: 0.8em;
            }

            .player-btn.play {
                width: 40px;
                height: 40px;
            }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, var(--secondary), var(--primary));
        }
    </style>
</head>
<body>
    <!-- STARS BACKGROUND -->
    <div class="stars" id="starsContainer"></div>

    <!-- AUTH SCREEN -->
    <div class="auth-screen active" id="authScreen">
        <div class="auth-container">
            <div class="auth-logo">
                <h1>🎵 Soundscape</h1>
                <p>Музыкальная социальная сеть</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <!-- LOGIN FORM -->
            <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
                <input class="auth-input" type="email" placeholder="Email" id="loginEmail" required>
                <input class="auth-input" type="password" placeholder="Пароль" id="loginPassword" required>
                <button class="auth-btn" type="submit">Войти</button>
            </form>

            <!-- REGISTER FORM -->
            <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                <input class="auth-input" type="text" placeholder="Имя пользователя" id="registerName" required>
                <input class="auth-input" type="email" placeholder="Email" id="registerEmail" required>
                <input class="auth-input" type="password" placeholder="Пароль" id="registerPassword" required>
                <input class="auth-input" type="password" placeholder="Подтвердите пароль" id="registerPasswordConfirm" required>
                <button class="auth-btn" type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-wrapper" id="appWrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="header-logo">🎵 Soundscape</div>
            <div class="header-user">
                <div class="user-badge">
                    LV <span id="userLevel">1</span>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Выход</button>
            </div>
        </div>

        <!-- TABS -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('discover')">🔥 Обнаружить</button>
            <button class="nav-tab" onclick="switchTab('library')">📚 Библиотека</button>
            <button class="nav-tab" onclick="switchTab('charts')">📊 Чарты</button>
            <button class="nav-tab" onclick="switchTab('profile')">👤 Профиль</button>
        </div>

        <!-- CONTENT -->
        <div class="content-wrapper">
            <div class="content-area">
                <!-- DISCOVER TAB -->
                <div class="tab-content active" id="discoverTab">
                    <div class="search-box">
                        <input class="search-input" type="text" id="searchInput" placeholder="🔍 Поиск треков...">
                        <button class="search-btn" onclick="searchTracks()">Поиск</button>
                        <button class="upload-btn" onclick="openUploadModal()">⬆️ Загрузить MP3</button>
                    </div>
                    <div id="messagesContainer"></div>
                    <div class="tracks-grid" id="tracksGrid"></div>
                </div>

                <!-- LIBRARY TAB -->
                <div class="tab-content" id="libraryTab">
                    <div class="search-box">
                        <input class="search-input" type="text" id="librarySearchInput" placeholder="🔍 Поиск в библиотеке...">
                        <button class="search-btn" onclick="searchLibrary()">Поиск</button>
                    </div>
                    <div class="tracks-grid" id="libraryGrid"></div>
                </div>

                <!-- CHARTS TAB -->
                <div class="tab-content" id="chartsTab">
                    <h2 style="color: var(--primary); margin-bottom: 20px;">🔥 Топ треки</h2>
                    <div id="chartsList"></div>
                </div>

                <!-- PROFILE TAB -->
                <div class="tab-content" id="profileTab">
                    <div class="profile-header">
                        <div class="profile-avatar" id="profileAvatar">👤</div>
                        <div class="profile-info">
                            <h2 id="profileUsername">Пользователь</h2>
                            <p id="profileEmail" style="color: rgba(255, 255, 255, 0.6); margin-bottom: 20px;">email@example.com</p>
                            
                            <div class="level-card">
                                <div class="level-display">
                                    <div class="level-badge" id="profileLevelBadge">1</div>
                                    <div class="level-info">
                                        <h3>Уровень <span id="profileLevelNumber">1</span></h3>
                                        <p id="profileXPText">0 / 1000 XP</p>
                                    </div>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" id="profileXPBar" style="width: 0%"></div>
                                </div>
                            </div>

                            <div class="profile-stats">
                                <div class="stat-box">
                                    <div class="stat-value" id="profileTracksCount">0</div>
                                    <div class="stat-label">Треков</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value" id="profilePlays">0</div>
                                    <div class="stat-label">Прослушиваний</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value" id="profileFavorites">0</div>
                                    <div class="stat-label">Избранных</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-value" id="profileCoins">0</div>
                                    <div class="stat-label">Монеты</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER -->
    <div class="player-container hidden" id="playerContainer">
        <div class="player-inner">
            <audio id="audioPlayer"></audio>
            <img class="player-cover" id="playerCover" alt="Cover">
            <div class="player-info">
                <div class="player-title" id="playerTitle">Выбери трек</div>
                <div class="player-artist" id="playerArtist">Артист</div>
                <div class="player-progress">
                    <span class="time-display" id="currentTime">0:00</span>
                    <input class="progress-input" type="range" id="progressBar" min="0" max="100" value="0" onchange="seekTrack()">
                    <span class="time-display" id="duration">0:00</span>
                </div>
            </div>
            <div class="player-controls">
                <button class="player-btn" onclick="previousTrack()">⏮</button>
                <button class="player-btn play" id="playBtn" onclick="togglePlay()">▶️</button>
                <button class="player-btn" onclick="nextTrack()">⏭</button>
                <button class="player-btn" onclick="closePlayer()">✕</button>
            </div>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeUploadModal()">&times;</button>
            <h3 class="modal-title">Загрузить трек</h3>
            
            <div class="upload-area" id="uploadArea" ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" onclick="document.getElementById('fileInput').click()">
                <div>📁 Перетащи MP3 файл или нажми для выбора</div>
                <div style="font-size: 0.8em; margin-top: 10px; color: rgba(255, 255, 255, 0.6);">Максимум 50 МБ</div>
            </div>
            <input class="upload-input" type="file" id="fileInput" accept=".mp3" onchange="handleFileSelect()">

            <form id="uploadForm">
                <div class="form-group">
                    <label class="form-label">Название трека</label>
                    <input class="form-input" type="text" id="trackTitle" placeholder="Название" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Исполнитель</label>
                    <input class="form-input" type="text" id="trackArtist" placeholder="Исполнитель" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Описание</label>
                    <textarea class="form-input" id="trackDescription" placeholder="Описание трека" style="min-height: 80px;"></textarea>
                </div>
                <button class="submit-btn" type="button" onclick="uploadTrack()">Загрузить 🚀</button>
            </form>
        </div>
    </div>

    <script>
        // ========== STATE ==========
        const APP = {
            currentUser: null,
            currentTrack: null,
            isPlaying: false,
            tracks: [],
            userTracks: [],
            userFavorites: [],
            players: {},
            currentIndex: -1
        };

        // ========== INITIALIZE ==========
        function initApp() {
            generateStars();
            loadUserData();
            if (APP.currentUser) {
                showMainApp();
                loadTracks();
                renderDiscovery();
            }
        }

        // ========== STARS BACKGROUND ==========
        function generateStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(star);
            }
        }

        // ========== AUTH ==========
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Form').classList.add('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // Check if user exists
            const users = JSON.parse(localStorage.getItem('soundscape-users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showMessage('Неверный email или пароль', 'error');
                return;
            }

            APP.currentUser = user;
            localStorage.setItem('soundscape-current-user', JSON.stringify(user));
            showMainApp();
            loadTracks();
            renderDiscovery();
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerPasswordConfirm').value;

            if (password !== confirm) {
                showMessage('Пароли не совпадают', 'error');
                return;
            }

            const users = JSON.parse(localStorage.getItem('soundscape-users') || '[]');
            
            if (users.find(u => u.email === email)) {
                showMessage('Этот email уже зарегистрирован', 'error');
                return;
            }

            const newUser = {
                id: Date.now(),
                name,
                email,
                password,
                level: 1,
                xp: 0,
                coins: 0,
                plays: 0,
                favorites: [],
                tracks: []
            };

            users.push(newUser);
            localStorage.setItem('soundscape-users', JSON.stringify(users));

            APP.currentUser = newUser;
            localStorage.setItem('soundscape-current-user', JSON.stringify(newUser));

            showMessage('🎉 Регистрация успешна!', 'success');
            setTimeout(() => {
                showMainApp();
                loadTracks();
                renderDiscovery();
            }, 500);
        }

        function handleLogout() {
            if (confirm('Вы уверены?')) {
                APP.currentUser = null;
                localStorage.removeItem('soundscape-current-user');
                location.reload();
            }
        }

        function showMainApp() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('appWrapper').classList.add('visible');
            updateUserBadge();
        }

        // ========== DATA MANAGEMENT ==========
        function loadUserData() {
            const user = localStorage.getItem('soundscape-current-user');
            if (user) {
                APP.currentUser = JSON.parse(user);
            }
        }

        function saveUserData() {
            if (APP.currentUser) {
                const users = JSON.parse(localStorage.getItem('soundscape-users') || '[]');
                const index = users.findIndex(u => u.id === APP.currentUser.id);
                if (index !== -1) {
                    users[index] = APP.currentUser;
                    localStorage.setItem('soundscape-users', JSON.stringify(users));
                }
                localStorage.setItem('soundscape-current-user', JSON.stringify(APP.currentUser));
            }
        }

        function loadTracks() {
            const allTracks = JSON.parse(localStorage.getItem('soundscape-tracks') || '[]');
            APP.tracks = allTracks;
            
            if (APP.currentUser) {
                APP.userTracks = allTracks.filter(t => t.userId === APP.currentUser.id);
                APP.userFavorites = APP.currentUser.favorites || [];
            }
        }

        // ========== TRACKS MANAGEMENT ==========
        function renderDiscovery() {
            const grid = document.getElementById('tracksGrid');
            grid.innerHTML = '';

            const sortedTracks = APP.tracks.sort((a, b) => (b.plays || 0) - (a.plays || 0));

            sortedTracks.forEach(track => {
                const isFavorite = APP.userFavorites.includes(track.id);
                grid.innerHTML += `
                    <div class="track-card">
                        <div class="track-cover" style="background: linear-gradient(135deg, ${getRandomColor()}, ${getRandomColor()})">
                            ${track.cover ? `<img src="${track.cover}" style="width: 100%; height: 100%; object-fit: cover;">` : '🎵'}
                        </div>
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-artist">${track.artist}</div>
                            <div class="track-stats">
                                <span>❤️ ${track.likes || 0}</span>
                                <span>🎵 ${track.plays || 0}</span>
                            </div>
                            <div class="track-actions">
                                <button class="track-btn" onclick="playTrack('${track.id}')">▶️ Включить</button>
                                <button class="track-btn ${isFavorite ? 'active' : ''}" onclick="toggleFavorite('${track.id}')">❤️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderLibrary() {
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';

            if (APP.userTracks.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255, 255, 255, 0.5);">📭 Библиотека пуста. Загрузи свой первый трек!</div>';
                return;
            }

            APP.userTracks.forEach(track => {
                const isFavorite = APP.userFavorites.includes(track.id);
                grid.innerHTML += `
                    <div class="track-card">
                        <div class="track-cover" style="background: linear-gradient(135deg, ${getRandomColor()}, ${getRandomColor()})">
                            ${track.cover ? `<img src="${track.cover}" style="width: 100%; height: 100%; object-fit: cover;">` : '🎵'}
                        </div>
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-artist">${track.artist}</div>
                            <div class="track-stats">
                                <span>❤️ ${track.likes || 0}</span>
                                <span>🎵 ${track.plays || 0}</span>
                            </div>
                            <div class="track-actions">
                                <button class="track-btn" onclick="playTrack('${track.id}')">▶️</button>
                                <button class="track-btn ${isFavorite ? 'active' : ''}" onclick="toggleFavorite('${track.id}')">❤️</button>
                                <button class="track-btn" onclick="deleteTrack('${track.id}')">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderCharts() {
            const list = document.getElementById('chartsList');
            list.innerHTML = '';

            const sortedTracks = APP.tracks
                .filter(t => t.plays > 0)
                .sort((a, b) => (b.plays || 0) - (a.plays || 0))
                .slice(0, 20);

            sortedTracks.forEach((track, index) => {
                list.innerHTML += `
                    <div class="chart-item">
                        <div class="chart-rank">#${index + 1}</div>
                        <div class="chart-cover" style="background: linear-gradient(135deg, ${getRandomColor()}, ${getRandomColor()})">
                            ${track.cover ? `<img src="${track.cover}" style="width: 100%; height: 100%; object-fit: cover;">` : '🎵'}
                        </div>
                        <div class="chart-details">
                            <div class="chart-title">${track.title}</div>
                            <div class="chart-artist">Исполнитель: ${track.artist}</div>
                        </div>
                        <div class="chart-plays">
                            <div class="chart-plays-value">${track.plays}</div>
                            <div class="chart-plays-label">Прослушиваний</div>
                        </div>
                        <button class="track-btn" onclick="playTrack('${track.id}')" style="margin-left: 10px;">▶️</button>
                    </div>
                `;
            });
        }

        function updateProfileTab() {
            if (!APP.currentUser) return;

            document.getElementById('profileUsername').textContent = APP.currentUser.name;
            document.getElementById('profileEmail').textContent = APP.currentUser.email;
            document.getElementById('profileLevelNumber').textContent = APP.currentUser.level;
            document.getElementById('profileLevelBadge').textContent = APP.currentUser.level;
            document.getElementById('profileCoins').textContent = APP.currentUser.coins;
            document.getElementById('profileTracksCount').textContent = APP.userTracks.length;
            document.getElementById('profilePlays').textContent = APP.currentUser.plays || 0;
            document.getElementById('profileFavorites').textContent = APP.userFavorites.length;

            const xpInLevel = APP.currentUser.xp % 1000;
            const progress = (xpInLevel / 1000) * 100;
            document.getElementById('profileXPBar').style.width = progress + '%';
            document.getElementById('profileXPText').textContent = `${xpInLevel} / 1000 XP`;
        }

        // ========== PLAYER ==========
        function playTrack(trackId) {
            const track = APP.tracks.find(t => t.id === trackId);
            if (!track) return;

            APP.currentTrack = track;
            const audio = document.getElementById('audioPlayer');
            
            // Convert stored file to URL
            if (track.file && track.file.startsWith('blob:')) {
                // Already a blob URL
                audio.src = track.file;
            } else {
                // Try to get from IndexedDB or storage
                getAudioFile(trackId).then(blob => {
                    if (blob) {
                        audio.src = URL.createObjectURL(blob);
                    }
                });
            }

            document.getElementById('playerTitle').textContent = track.title;
            document.getElementById('playerArtist').textContent = track.artist;
            document.getElementById('playerCover').style.background = `linear-gradient(135deg, ${getRandomColor()}, ${getRandomColor()})`;
            
            document.getElementById('playerContainer').classList.remove('hidden');
            audio.play();
            APP.isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸️';

            // Update plays count
            track.plays = (track.plays || 0) + 1;
            APP.currentUser.plays = (APP.currentUser.plays || 0) + 1;
            saveUserData();
            
            // Add XP
            addXP(10);
        }

        function togglePlay() {
            const audio = document.getElementById('audioPlayer');
            if (APP.isPlaying) {
                audio.pause();
                APP.isPlaying = false;
                document.getElementById('playBtn').textContent = '▶️';
            } else {
                audio.play();
                APP.isPlaying = true;
                document.getElementById('playBtn').textContent = '⏸️';
            }
        }

        function seekTrack() {
            const audio = document.getElementById('audioPlayer');
            const progress = document.getElementById('progressBar').value;
            audio.currentTime = (progress / 100) * audio.duration;
        }

        function previousTrack() {
            if (!APP.currentTrack || !APP.tracks.length) return;
            const index = APP.tracks.findIndex(t => t.id === APP.currentTrack.id);
            if (index > 0) {
                playTrack(APP.tracks[index - 1].id);
            }
        }

        function nextTrack() {
            if (!APP.currentTrack || !APP.tracks.length) return;
            const index = APP.tracks.findIndex(t => t.id === APP.currentTrack.id);
            if (index < APP.tracks.length - 1) {
                playTrack(APP.tracks[index + 1].id);
            }
        }

        function closePlayer() {
            document.getElementById('audioPlayer').pause();
            document.getElementById('playerContainer').classList.add('hidden');
            APP.isPlaying = false;
        }

        // Setup audio events
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audioPlayer');
            if (audio) {
                audio.addEventListener('timeupdate', () => {
                    const progress = document.getElementById('progressBar');
                    const currentTime = document.getElementById('currentTime');
                    const duration = document.getElementById('duration');
                    
                    if (audio.duration) {
                        progress.value = (audio.currentTime / audio.duration) * 100;
                        currentTime.textContent = formatTime(audio.currentTime);
                        duration.textContent = formatTime(audio.duration);
                    }
                });

                audio.addEventListener('ended', () => {
                    nextTrack();
                });
            }

            initApp();
        });

        // ========== UPLOAD ==========
        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('uploadForm').reset();
        }

        function handleDragOver(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('drag-over');
        }

        function handleDragLeave(e) {
            document.getElementById('uploadArea').classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                handleFileSelect();
            }
        }

        function handleFileSelect() {
            const file = document.getElementById('fileInput').files[0];
            if (file) {
                if (file.size > 50 * 1024 * 1024) {
                    showMessage('Файл слишком большой (максимум 50 МБ)', 'error');
                    return;
                }
                if (file.type !== 'audio/mpeg' && !file.name.endsWith('.mp3')) {
                    showMessage('Выбери MP3 файл', 'error');
                    return;
                }
                showMessage('✅ Файл выбран: ' + file.name, 'success');
            }
        }

        function uploadTrack() {
            const file = document.getElementById('fileInput').files[0];
            const title = document.getElementById('trackTitle').value;
            const artist = document.getElementById('trackArtist').value;
            const description = document.getElementById('trackDescription').value;

            if (!file) {
                showMessage('Выбери MP3 файл', 'error');
                return;
            }

            if (!title || !artist) {
                showMessage('Заполни название и исполнителя', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                const newTrack = {
                    id: Date.now().toString(),
                    title,
                    artist,
                    description,
                    userId: APP.currentUser.id,
                    file: reader.result,
                    plays: 0,
                    likes: 0,
                    uploadDate: new Date().toISOString()
                };

                const allTracks = JSON.parse(localStorage.getItem('soundscape-tracks') || '[]');
                allTracks.push(newTrack);
                localStorage.setItem('soundscape-tracks', JSON.stringify(allTracks));

                // Store in IndexedDB for large files
                storeAudioFile(newTrack.id, file);

                showMessage('🎉 Трек успешно загружен!', 'success');
                loadTracks();
                renderLibrary();
                
                setTimeout(() => {
                    closeUploadModal();
                }, 1000);
            };

            reader.readAsDataURL(file);
        }

        function storeAudioFile(trackId, file) {
            const request = indexedDB.open('SoundscapeDB', 1);
            
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('tracks')) {
                    db.createObjectStore('tracks');
                }
            };

            request.onsuccess = (event) => {
                const db = event.target.result;
                const transaction = db.transaction(['tracks'], 'readwrite');
                const store = transaction.objectStore('tracks');
                store.put(file, trackId);
            };
        }

        function getAudioFile(trackId) {
            return new Promise((resolve) => {
                const request = indexedDB.open('SoundscapeDB', 1);
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    const transaction = db.transaction(['tracks'], 'readonly');
                    const store = transaction.objectStore('tracks');
                    const getRequest = store.get(trackId);
                    
                    getRequest.onsuccess = () => {
                        resolve(getRequest.result);
                    };
                };
            });
        }

        function deleteTrack(trackId) {
            if (!confirm('Удалить трек?')) return;

            const allTracks = JSON.parse(localStorage.getItem('soundscape-tracks') || '[]');
            const index = allTracks.findIndex(t => t.id === trackId);
            if (index !== -1) {
                allTracks.splice(index, 1);
                localStorage.setItem('soundscape-tracks', JSON.stringify(allTracks));
                loadTracks();
                renderLibrary();
                showMessage('🗑️ Трек удален', 'success');
            }
        }

        // ========== FAVORITES & INTERACTION ==========
        function toggleFavorite(trackId) {
            const index = APP.userFavorites.indexOf(trackId);
            if (index !== -1) {
                APP.userFavorites.splice(index, 1);
            } else {
                APP.userFavorites.push(trackId);
                addXP(5);
            }

            APP.currentUser.favorites = APP.userFavorites;
            saveUserData();

            // Update likes count
            const track = APP.tracks.find(t => t.id === trackId);
            if (track) {
                track.likes = APP.userFavorites.includes(trackId) ? (track.likes || 0) + 1 : Math.max(0, (track.likes || 1) - 1);
            }

            renderDiscovery();
            renderLibrary();
        }

        // ========== SEARCH ==========
        function searchTracks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('tracksGrid');
            grid.innerHTML = '';

            const results = APP.tracks.filter(t => 
                t.title.toLowerCase().includes(query) || 
                t.artist.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255, 255, 255, 0.5);">😔 Треки не найдены</div>';
                return;
            }

            results.forEach(track => {
                const isFavorite = APP.userFavorites.includes(track.id);
                grid.innerHTML += `
                    <div class="track-card">
                        <div class="track-cover" style="background: linear-gradient(135deg, ${getRandomColor()}, ${getRandomColor()})">
                            ${track.cover ? `<img src="${track.cover}">` : '🎵'}
                        </div>
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-artist">${track.artist}</div>
                            <div class="track-stats">
                                <span>❤️ ${track.likes || 0}</span>
                                <span>🎵 ${track.plays || 0}</span>
                            </div>
                            <div class="track-actions">
                                <button class="track-btn" onclick="playTrack('${track.id}')">▶️</button>
                                <button class="track-btn ${isFavorite ? 'active' : ''}" onclick="toggleFavorite('${track.id}')">❤️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function searchLibrary() {
            const query = document.getElementById('librarySearchInput').value.toLowerCase();
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = '';

            const results = APP.userTracks.filter(t => 
                t.title.toLowerCase().includes(query) || 
                t.artist.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: rgba(255, 255, 255, 0.5);">😔 Треки не найдены</div>';
                return;
            }

            results.forEach(track => {
                const isFavorite = APP.userFavorites.includes(track.id);
                grid.innerHTML += `
                    <div class="track-card">
                        <div class="track-cover" style="background: linear-gradient(135deg, ${getRandomColor()}, ${getRandomColor()})">
                            ${track.cover ? `<img src="${track.cover}">` : '🎵'}
                        </div>
                        <div class="track-info">
                            <div class="track-title">${track.title}</div>
                            <div class="track-artist">${track.artist}</div>
                            <div class="track-actions">
                                <button class="track-btn" onclick="playTrack('${track.id}')">▶️</button>
                                <button class="track-btn" onclick="deleteTrack('${track.id}')">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // ========== XP & LEVEL ==========
        function addXP(amount) {
            APP.currentUser.xp += amount;

            const newLevel = Math.floor(APP.currentUser.xp / 1000) + 1;
            if (newLevel > APP.currentUser.level) {
                APP.currentUser.level = newLevel;
                APP.currentUser.coins += 100 * newLevel;
                showMessage(`🎉 Уровень ${newLevel}! +${100 * newLevel} монет!`, 'success');
            }

            saveUserData();
            updateUserBadge();
        }

        function updateUserBadge() {
            document.getElementById('userLevel').textContent = APP.currentUser.level;
        }

        // ========== UTILS ==========
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');

            if (tab === 'library') renderLibrary();
            if (tab === 'charts') renderCharts();
            if (tab === 'profile') updateProfileTab();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function getRandomColor() {
            const colors = ['#ff006e', '#00d4ff', '#8338ec', '#ffbe0b', '#06ffa5'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function showMessage(text, type) {
            const container = document.getElementById('messagesContainer');
            if (!container) return;

            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            container.appendChild(msg);

            setTimeout(() => msg.remove(), 3000);
        }
    </script>
</body>
</html>
