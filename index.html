<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>SoundScape Pro 🌌 Россия</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--primary:#0066ff;--secondary:#ff6600;--accent:#00d4ff;--dark:#0a0e27;--darker:#060818;--card:rgba(10,14,39,0.7);--border:rgba(0,102,255,0.3);--success:#00ff88;--danger:#ff4444;--gold:#ffd700;--russia-white:#fff;--russia-blue:#0039a6;--russia-red:#d52b1e}
body{background:linear-gradient(135deg,var(--dark),var(--darker));color:#fff;min-height:100vh;padding-bottom:120px;overflow-x:hidden}
.space-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:1}}
.header{background:linear-gradient(135deg,var(--primary),var(--secondary));padding:20px;text-align:center;position:relative}
.header h1{font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
.stats{display:flex;justify-content:space-around;padding:12px;background:rgba(0,0,0,0.4);flex-wrap:wrap;gap:8px}
.stat{background:linear-gradient(135deg,rgba(0,102,255,0.3),rgba(255,102,0,0.3));border:2px solid var(--border);padding:10px 15px;border-radius:12px;text-align:center;flex:1;min-width:70px}
.stat-value{font-size:22px;font-weight:bold;color:var(--accent)}
.stat-label{font-size:10px;opacity:0.9;margin-top:2px}
.nav{display:flex;justify-content:center;gap:8px;padding:12px;background:rgba(10,14,39,0.95);flex-wrap:wrap;position:sticky;top:0;z-index:100}
.btn{padding:10px 18px;border:none;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px;background:linear-gradient(135deg,var(--primary),#0099ff);color:white;min-height:44px}
.btn-orange{background:linear-gradient(135deg,var(--secondary),#ff8c00)}
.section{display:none;padding:15px;animation:fadeIn 0.4s}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.search-box{background:var(--card);border:2px solid var(--border);border-radius:15px;padding:15px;margin-bottom:15px}
.search-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:25px;background:rgba(0,0,0,0.4);color:white;font-size:15px;outline:none;margin-bottom:12px;text-align:center;min-height:44px}
.btn-search{width:100%;padding:14px;border:none;border-radius:25px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;font-size:15px;cursor:pointer;font-weight:bold;min-height:44px}
.track{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px}
.track:active{transform:scale(0.98);border-color:var(--secondary)}
.track-cover{width:60px;height:60px;min-width:60px;background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.track-info{flex:1}
.track-title{font-weight:bold;font-size:14px}
.track-artist{font-size:12px;opacity:0.8}
.track-play-btn{font-size:20px;color:var(--accent)}
.info-box{background:linear-gradient(135deg,rgba(0,102,255,0.3),rgba(255,102,0,0.3));border:2px solid var(--border);border-radius:12px;padding:15px;margin-bottom:15px;text-align:center}
.loading{text-align:center;padding:30px;opacity:0.7}
.player-container{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,rgba(0,102,255,0.98),rgba(255,102,0,0.98));padding:15px;z-index:1000;display:none}
.player-container.active{display:block}
.player-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.player-controls{display:flex;gap:10px}
.ctrl{width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,0.2);color:white;cursor:pointer;font-size:20px}
.ctrl.play{width:54px;height:54px;background:white;color:var(--primary)}
audio{width:100%;height:40px;border-radius:10px}
.notif{position:fixed;top:15px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(135deg,var(--primary),var(--secondary));padding:12px 24px;border-radius:25px;transition:all 0.3s;z-index:3000;font-weight:bold}
.notif.show{transform:translateX(-50%) translateY(0)}
.youtube-container{background:var(--card);border:2px solid var(--border);border-radius:15px;padding:15px;margin-bottom:15px}
.youtube-iframe{width:100%;border-radius:12px;margin:10px 0}
.device-badge{display:inline-block;background:var(--success);color:#000;padding:3px 10px;border-radius:10px;font-size:11px;margin-left:10px}
@media(max-width:768px){.header h1{font-size:22px}.stat-value{font-size:18px}}
</style>
</head>
<body>
<div class="space-bg" id="space-bg"></div>

<div class="header">
<h1>🌌 SoundScape Pro <span class="device-badge" id="device-badge">📱</span></h1>
<p>Федеральная Музыкальная Соцсеть</p>
</div>

<div class="stats">
<div class="stat"><div class="stat-value" id="xp">0</div><div class="stat-label">⭐ XP</div></div>
<div class="stat"><div class="stat-value" id="level">1</div><div class="stat-label">📊 Уровень</div></div>
<div class="stat"><div class="stat-value" id="played">0</div><div class="stat-label">🎧 Сыграно</div></div>
</div>

<div class="nav">
<button class="btn" onclick="showSection('search')">🔍 Поиск</button>
<button class="btn" onclick="showSection('library')">📚 Библиотека</button>
<button class="btn btn-orange" onclick="showSection('games')">🎮 Игры</button>
<button class="btn" onclick="showSection('profile')">👤 Профиль</button>
</div>

<div id="search" class="section active">
<h2 style="margin-bottom:20px;text-align:center;font-size:24px">🔍 Поиск музыки</h2>
<div class="search-box">
<input type="text" class="search-input" id="query" placeholder="Введи артиста или трек..." onkeypress="if(event.key==='Enter')searchMusic()">
<button class="btn-search" onclick="searchMusic()">🔍 Найти музыку</button>
</div>
<div id="device-info" style="margin-bottom:15px"></div>
<div id="search-results"></div>
</div>

<div id="library" class="section">
<h2 style="margin-bottom:20px;text-align:center;font-size:24px">📚 Библиотека</h2>
<div class="info-box">🎵 <strong id="lib-count">3 трека</strong></div>
<div id="library-list"></div>
</div>

<div id="games" class="section">
<h2 style="margin-bottom:20px;text-align:center;font-size:24px">🎮 Игры</h2>
<div class="info-box">Выбери игру и зарабатывай XP!</div>
<button class="btn" onclick="startGuessGame()" style="width:100%;margin-bottom:10px">🎵 Угадай трек</button>
<button class="btn btn-orange" onclick="startRhythmGame()" style="width:100%">🎯 Ритм-игра</button>
</div>

<div id="profile" class="section">
<h2 style="margin-bottom:20px;text-align:center;font-size:24px">👤 Профиль</h2>
<div class="info-box">
Уровень: <strong id="profile-level">1</strong><br>
XP: <strong id="profile-xp">0</strong><br>
Прослушано: <strong id="profile-played">0</strong>
</div>
</div>

<div class="player-container" id="player-container">
<audio id="audio" preload="none" playsinline webkit-playsinline></audio>
<div class="player-info">
<div style="flex:1">
<div id="p-title">Название</div>
<div id="p-artist" style="font-size:12px;opacity:0.9">Исполнитель</div>
</div>
<div class="player-controls">
<button class="ctrl" onclick="togglePlay()" id="play-btn">▶</button>
<button class="ctrl" onclick="stopPlayback()">⏹</button>
</div>
</div>
</div>

<div class="notif" id="notif"></div>

<script>
// ===== ОПРЕДЕЛЕНИЕ УСТРОЙСТВА =====
var isiPhone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
var isAndroid = /Android/i.test(navigator.userAgent);
var deviceType = isiPhone ? 'iPhone' : (isAndroid ? 'Android' : 'Desktop');

document.getElementById('device-badge').textContent = isiPhone ? '🍎 iPhone' : (isAndroid ? '🤖 Android' : '💻 PC');
document.getElementById('device-info').innerHTML = '<div class="info-box">📱 Устройство: <strong>' + deviceType + '</strong><br><small>' + (isiPhone ? 'Используем YouTube (лучшее качество)' : 'Используем iTunes + Deezer') + '</small></div>';

// ===== КОСМИЧЕСКИЙ ФОН =====
(function(){
var bg=document.getElementById('space-bg');
for(var i=0;i<100;i++){
var s=document.createElement('div');
s.className='star';
s.style.cssText='width:'+Math.random()*3+'px;height:'+Math.random()*3+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+Math.random()*3+'s';
bg.appendChild(s);
}
})();

// ===== ДАННЫЕ =====
var libraryTracks=[
{id:'1',title:'Ты не бойся ночи',artist:'ENZRO',url:'https://cdn.jsdelivr.net/gh/melnikovvitalij02-hub/Soundscape2@main/ENZRO_-_Ty_ne_bojjsya_nochi_81423717.mp3'},
{id:'2',title:'А красивых женщин много',artist:'Igor Malinin',url:'https://cdn.jsdelivr.net/gh/melnikovvitalij02-hub/Soundscape2@main/Igor_Malinin_-_A_krasivykh_zhenshhin_mnogo_81681758.mp3'},
{id:'3',title:'Она танцует под Шаде',artist:'Indiya by',url:'https://cdn.jsdelivr.net/gh/melnikovvitalij02-hub/Soundscape2@main/Indiya_by_-_Ona_tancuet_pod_shadje_81415262.mp3'}
];

var library=[...libraryTracks];
var xp=parseInt(localStorage.getItem('ss_xp')||'0');
var played=parseInt(localStorage.getItem('ss_played')||'0');
var currentTrack=null;
var isPlaying=false;
var audio=document.getElementById('audio');

// ===== УМНЫЙ ПОИСК (iPhone vs Android) =====
function searchMusic() {
    var query = document.getElementById('query').value.trim();
    if (!query) {
        show('⚠️ Введи название');
        return;
    }

    var results = document.getElementById('search-results');

    if (isiPhone) {
        // IPHONE: YouTube oEmbed
        searchYouTube(query, results);
    } else {
        // ANDROID/DESKTOP: iTunes + Deezer fallback
        searchiTunesDeezer(query, results);
    }
}

// ===== ПОИСК ЧЕРЕЗ YOUTUBE (ДЛЯ IPHONE) =====
function searchYouTube(query, results) {
    results.innerHTML = '<div class="loading">🔍 Поиск на YouTube...</div>';

    // Создаём iframe с поиском YouTube
    var searchQuery = encodeURIComponent(query);
    var html = `
        <div class="youtube-container">
            <h3 style="margin-bottom:10px">🎵 Результаты поиска: ${query}</h3>
            <iframe
                class="youtube-iframe"
                width="100%"
                height="315"
                src="https://www.youtube.com/embed?listType=search&list=${searchQuery}"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
            <div class="info-box" style="margin-top:15px">
                📱 <strong>На iPhone:</strong><br>
                • Нажмите на видео для просмотра<br>
                • Для прослушивания включите полноэкранный режим<br>
                • YouTube работает стабильно на iOS
            </div>
            <button class="btn" onclick="window.open('https://www.youtube.com/results?search_query=${searchQuery}', '_blank')" style="width:100%;margin-top:10px">
                🔗 Открыть в приложении YouTube
            </button>
        </div>
    `;

    results.innerHTML = html;
    show('🎵 YouTube поиск активирован');
    addXP(2);
}

// ===== ПОИСК ЧЕРЕЗ ITUNES + DEEZER (ДЛЯ ANDROID) =====
function searchiTunesDeezer(query, results) {
    results.innerHTML = '<div class="loading">🔍 Поиск через iTunes...</div>';

    // Пробуем iTunes (5 секунд)
    var itunesTimeout = setTimeout(function() {
        results.innerHTML = '<div class="loading">🔄 iTunes не отвечает, пробуем Deezer...</div>';
        tryDeezerSearch(query, results);
    }, 5000);

    var callbackName = 'itunes_' + Date.now();
    var script = document.createElement('script');

    window[callbackName] = function(data) {
        clearTimeout(itunesTimeout);
        if (data.results && data.results.length > 0) {
            displaySearchResults(data.results.map(function(t) {
                return {
                    id: 'itunes_' + t.trackId,
                    title: t.trackName,
                    artist: t.artistName,
                    url: t.previewUrl || '',
                    artwork: t.artworkUrl100 ? t.artworkUrl100.replace('100x100', '300x300') : '',
                    album: t.collectionName
                };
            }), results);
            show('🎵 Найдено: ' + data.results.length + ' треков');
        } else {
            tryDeezerSearch(query, results);
        }
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];
    };

    script.onerror = function() {
        clearTimeout(itunesTimeout);
        tryDeezerSearch(query, results);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];
    };

    script.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(query) +
                 '&media=music&limit=50&entity=song&callback=' + callbackName;
    document.head.appendChild(script);
}

function tryDeezerSearch(query, results) {
    results.innerHTML = '<div class="loading">🔄 Поиск через Deezer...</div>';

    fetch('https://api.deezer.com/search?q=' + encodeURIComponent(query) + '&limit=50')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (!data.data || data.data.length === 0) {
            results.innerHTML = '<div class="info-box">⚠️ Ничего не найдено. Попробуйте другой запрос.</div>';
            return;
        }
        displaySearchResults(data.data.map(function(t) {
            return {
                id: 'deezer_' + t.id,
                title: t.title,
                artist: t.artist.name,
                url: t.preview || '',
                artwork: t.album.cover_medium || t.album.cover_small || '',
                album: t.album.title
            };
        }), results);
        show('🎵 Найдено через Deezer: ' + data.data.length + ' треков');
    })
    .catch(function(e) {
        results.innerHTML = '<div class="info-box">⚠️ Поиск недоступен. Проверьте интернет.</div>';
    });
}

function displaySearchResults(tracks, results) {
    var html = '<div class="info-box">🎵 Найдено: <strong>' + tracks.length + '</strong> треков</div>';
    tracks.forEach(function(t, i) {
        var img = t.artwork ? '<div class="track-cover" style="background-image:url(\'' + t.artwork + '\');background-size:cover"></div>' : '<div class="track-cover">🎵</div>';
        html += '<div class="track" onclick="playSearchTrack(' + i + ')">' + img +
                '<div class="track-info"><div class="track-title">' + t.title + '</div>' +
                '<div class="track-artist">' + t.artist + '</div>' +
                (t.album ? '<div style="font-size:11px;opacity:0.6">' + t.album + '</div>' : '') +
                '</div><div class="track-play-btn">▶</div></div>';
    });
    results.innerHTML = html;
    window.searchResults = tracks;
}

function playSearchTrack(index) {
    if (!window.searchResults || !window.searchResults[index]) return;
    var t = window.searchResults[index];
    if (!t.url) {
        show('⚠️ Нет превью для этого трека');
        return;
    }
    loadTrackToPlayer(t);
}

// ===== БИБЛИОТЕКА =====
function renderLibrary() {
    var list = document.getElementById('library-list');
    document.getElementById('lib-count').textContent = library.length + ' треков';
    var html = '';
    library.forEach(function(t, i) {
        html += '<div class="track" onclick="playLibraryTrack(' + i + ')"><div class="track-cover">🎵</div>' +
                '<div class="track-info"><div class="track-title">' + t.title + '</div>' +
                '<div class="track-artist">' + t.artist + '</div></div>' +
                '<div class="track-play-btn">▶</div></div>';
    });
    list.innerHTML = html;
}

function playLibraryTrack(index) {
    if (index < 0 || index >= library.length) return;
    loadTrackToPlayer(library[index]);
}

function loadTrackToPlayer(track) {
    if (!track || !track.url) {
        show('⚠️ Ошибка: трек не найден');
        return;
    }
    currentTrack = track;
    audio.pause();
    audio.src = track.url;
    document.getElementById('p-title').textContent = track.title;
    document.getElementById('p-artist').textContent = track.artist;
    document.getElementById('player-container').classList.add('active');
    isPlaying = false;
    document.getElementById('play-btn').textContent = '▶';
    show('🎵 ' + track.title + ' — Нажми ▶');
    played++;
    addXP(2);
    updateStats();
}

function togglePlay() {
    if (!currentTrack) {
        show('⚠️ Сначала выбери трек');
        return;
    }
    if (isPlaying) {
        audio.pause();
    } else {
        audio.play().then(function() {
            show('▶ Играет');
        }).catch(function(err) {
            show('⚠️ Ошибка: ' + err.message);
        });
    }
}

function stopPlayback() {
    audio.pause();
    audio.currentTime = 0;
    currentTrack = null;
    isPlaying = false;
    document.getElementById('player-container').classList.remove('active');
    document.getElementById('play-btn').textContent = '▶';
    show('⏹ Остановлено');
}

// ===== ИГРЫ =====
function startGuessGame() {
    if (library.length === 0) {
        show('⚠️ Нет треков');
        return;
    }
    var quizTrack = library[Math.floor(Math.random() * library.length)];
    var answer = prompt('Угадай трек:\n\nИсполнитель: ' + quizTrack.artist + '\n\nПодсказка: первая буква - ' + quizTrack.title[0]);
    if (answer && answer.toLowerCase().trim() === quizTrack.title.toLowerCase()) {
        show('✅ Правильно! +50 XP');
        addXP(50);
    } else {
        show('❌ Не угадал! Это был: ' + quizTrack.title);
    }
}

function startRhythmGame() {
    var score = 0;
    var time = 10;
    show('🎯 Ритм-игра! Нажимай OK когда увидишь зелёный!');
    var interval = setInterval(function() {
        time--;
        if (time <= 0) {
            clearInterval(interval);
            addXP(score * 10);
            show('🏆 Результат: ' + score + ' | +' + (score * 10) + ' XP');
        }
    }, 1000);
    setTimeout(function() {
        if (confirm('🟢 ЖМИ!')) {
            score++;
        }
    }, 1500);
}

// ===== НАВИГАЦИЯ =====
function showSection(id) {
    document.querySelectorAll('.section').forEach(function(s) {
        s.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
    if (id === 'library') renderLibrary();
    if (id === 'profile') updateStats();
    window.scrollTo(0, 0);
}

// ===== УТИЛИТЫ =====
function addXP(amount) {
    xp += amount;
    localStorage.setItem('ss_xp', xp);
    updateStats();
}

function updateStats() {
    document.getElementById('xp').textContent = xp;
    document.getElementById('level').textContent = Math.floor(xp / 100) + 1;
    document.getElementById('played').textContent = played;
    document.getElementById('profile-xp').textContent = xp;
    document.getElementById('profile-level').textContent = Math.floor(xp / 100) + 1;
    document.getElementById('profile-played').textContent = played;
}

function show(text) {
    var n = document.getElementById('notif');
    n.textContent = text;
    n.classList.add('show');
    setTimeout(function() {
        n.classList.remove('show');
    }, 2500);
}

// ===== ИНИЦИАЛИЗАЦИЯ =====
window.addEventListener('load', function() {
    updateStats();
    renderLibrary();
    show('🌌 SoundScape Pro готов!');
});

audio.addEventListener('ended', function() {
    isPlaying = false;
    document.getElementById('play-btn').textContent = '▶';
    show('✅ Трек завершён');
});

audio.addEventListener('play', function() {
    isPlaying = true;
    document.getElementById('play-btn').textContent = '⏸';
});

audio.addEventListener('pause', function() {
    isPlaying = false;
    document.getElementById('play-btn').textContent = '▶';
});
</script>
</body>
</html>
