<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundScape Pro 🎵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 120px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        header { text-align: center; margin-bottom: 20px; color: white; }
        header h1 { font-size: 2em; margin-bottom: 5px; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: rgba(255,255,255,0.15); padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        .stat { text-align: center; color: white; }
        .stat-value { font-size: 1.5em; font-weight: bold; }
        .stat-label { font-size: 0.75em; }
        
        .nav { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
        .nav-btn { padding: 10px 20px; background: rgba(255,255,255,0.25); border: none; border-radius: 20px; color: white; cursor: pointer; font-weight: 600; white-space: nowrap; }
        .nav-btn.active { background: white; color: #667eea; }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box input { flex: 1; padding: 12px 15px; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; font-size: 1em; }
        .search-btn { padding: 12px 25px; background: white; color: #667eea; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .track-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; }
        .track-card:active { transform: scale(0.98); }
        .track-thumb { width: 100%; height: 160px; object-fit: cover; }
        .track-info { padding: 12px; }
        .track-title { font-weight: 600; margin-bottom: 5px; font-size: 0.9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .track-artist { color: #999; font-size: 0.8em; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .play-btn { width: 100%; padding: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        
        .player { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 15px; box-shadow: 0 -5px 30px rgba(0,0,0,0.4); z-index: 1000; display: none; }
        .player.active { display: block; }
        .player-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: 15px; align-items: center; }
        .player-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .player-info { flex: 1; }
        .player-title { font-weight: 600; font-size: 1em; margin-bottom: 3px; }
        .player-artist { opacity: 0.8; font-size: 0.85em; margin-bottom: 8px; }
        .progress-container { display: flex; align-items: center; gap: 8px; }
        .progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; -webkit-appearance: none; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #667eea; border-radius: 50%; cursor: pointer; }
        .time { font-size: 0.75em; opacity: 0.8; min-width: 40px; font-family: monospace; }
        .controls { display: flex; gap: 8px; }
        .ctrl-btn { width: 40px; height: 40px; border: none; background: rgba(255,255,255,0.15); color: white; border-radius: 50%; cursor: pointer; font-size: 1.2em; }
        .ctrl-btn.play { background: linear-gradient(135deg, #667eea, #764ba2); width: 50px; height: 50px; font-size: 1.4em; }
        
        .library-item { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .game-card { background: white; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; }
        .game-icon { font-size: 2.5em; margin-bottom: 8px; }
        
        .achievement { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .achievement.locked { opacity: 0.5; }
        
        .auth-box { background: white; padding: 25px; border-radius: 15px; max-width: 350px; margin: 0 auto; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd; border-radius: 8px; }
        .auth-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .fallback-link { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #667eea; color: white; text-decoration: none; border-radius: 6px; }
        
        #youtube-player { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 SoundScape Pro</h1>
            <p>Музыка • Игры • Достижения</p>
        </header>

        <div class="stats">
            <div class="stat"><div class="stat-value" id="xp">0</div><div class="stat-label">⭐ XP</div></div>
            <div class="stat"><div class="stat-value" id="level">1</div><div class="stat-label">📊 Уровень</div></div>
            <div class="stat"><div class="stat-value" id="coins">100</div><div class="stat-label">🪙 Монеты</div></div>
            <div class="stat"><div class="stat-value" id="played">0</div><div class="stat-label"> Сыграно</div></div>
        </div>

        <div class="nav">
            <button class="nav-btn active" onclick="showSection('search')">🔍 Поиск</button>
            <button class="nav-btn" onclick="showSection('library')">📚 Библиотека</button>
            <button class="nav-btn" onclick="showSection('games')">🎮 Игры</button>
            <button class="nav-btn" onclick="showSection('achievements')">🏆 Достижения</button>
            <button class="nav-btn" onclick="showSection('profile')">👤 Профиль</button>
        </div>

        <div id="search" class="section active">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 Поиск трека..." onkeypress="if(event.key==='Enter')performSearch()">
                <button class="search-btn" onclick="performSearch()">Найти</button>
            </div>
            <div id="results" class="results"></div>
        </div>

        <div id="library" class="section">
            <h2 style="color: white; margin-bottom: 15px;">📚 Библиотека</h2>
            <div id="library-list"></div>
        </div>

        <div id="games" class="section">
            <h2 style="color: white; margin-bottom: 15px;">🎮 Игры</h2>
            <div class="game-grid">
                <div class="game-card" onclick="startSnake()"><div class="game-icon">🐍</div><h3>Змейка</h3></div>
                <div class="game-card" onclick="start2048()"><div class="game-icon"></div><h3>2048</h3></div>
                <div class="game-card" onclick="startGuess()"><div class="game-icon">🎵</div><h3>Угадай трек</h3></div>
            </div>
            <div id="game-area" style="margin-top:15px;display:none;text-align:center">
                <canvas id="game-canvas" width="350" height="350" style="background:#000;border-radius:10px;max-width:100%"></canvas>
                <br><br><button class="nav-btn" onclick="closeGame()">❌ Закрыть</button>
            </div>
        </div>

        <div id="achievements" class="section">
            <h2 style="color: white; margin-bottom: 15px;">🏆 Достижения</h2>
            <div id="achievements-list"></div>
        </div>

        <div id="profile" class="section">
            <div id="auth-form" class="auth-box">
                <h2 style="margin-bottom:15px;text-align:center">🔐 Вход</h2>
                <input type="text" id="username" class="auth-input" placeholder="Имя">
                <input type="password" id="password" class="auth-input" placeholder="Пароль">
                <button class="auth-btn" onclick="login()">Войти</button>
                <button class="auth-btn" onclick="register()" style="margin-top:10px;background:#28a745">Регистрация</button>
            </div>
            <div id="profile-data" style="display:none;text-align:center;color:white;padding:20px">
                <h2 id="profile-name" style="margin-bottom:15px"></h2>
                <p style="margin-bottom:10px">Уровень: <strong id="profile-level"></strong></p>
                <button class="nav-btn" onclick="logout()">Выйти</button>
            </div>
        </div>
    </div>

    <div id="youtube-player"></div>
    
    <div class="player" id="player">
        <div class="player-inner">
            <img id="player-thumb" class="player-thumb" src="" alt="">
            <div class="player-info">
                <div class="player-title" id="player-title">Выберите трек</div>
                <div class="player-artist" id="player-artist">Артист</div>
                <div class="progress-container">
                    <span class="time" id="current-time">0:00</span>
                    <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
                    <span class="time" id="total-time">0:00</span>
                </div>
            </div>
            <div class="controls">
                <button class="ctrl-btn" onclick="skip(-15)">⏪</button>
                <button class="ctrl-btn play" id="play-btn" onclick="togglePlay()">▶️</button>
                <button class="ctrl-btn" onclick="skip(15)">⏩</button>
                <button class="ctrl-btn" onclick="closePlayer()"></button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://soundscape-api-9fng.onrender.com';
        let player = null;
        let playerReady = false;
        let currentVideoId = null;
        let isPlaying = false;
        let progressInterval = null;
        
        let xp = parseInt(localStorage.getItem('ss_xp')) || 0;
        let level = parseInt(localStorage.getItem('ss_level')) || 1;
        let coins = parseInt(localStorage.getItem('ss_coins')) || 100;
        let played = parseInt(localStorage.getItem('ss_played')) || 0;
        let achievements = JSON.parse(localStorage.getItem('ss_achievements')) || [];
        let currentUser = localStorage.getItem('ss_user') || null;
        
        let library = JSON.parse(localStorage.getItem('ss_library')) || [
            {id:'1',title:'Never Gonna Give You Up',artist:'Rick Astley',videoId:'dQw4w9WgXcQ',thumb:'https://i.ytimg.com/vi/dQw4w9WgXcQ/mqdefault.jpg'},
            {id:'2',title:'Gangnam Style',artist:'PSY',videoId:'9bZkp7q19f0',thumb:'https://i.ytimg.com/vi/9bZkp7q19f0/mqdefault.jpg'},
            {id:'3',title:'Despacito',artist:'Luis Fonsi',videoId:'kJQP7kiw5Fk',thumb:'https://i.ytimg.com/vi/kJQP7kiw5Fk/mqdefault.jpg'}
        ];

        // ЗАГРУЗКА YOUTUBE API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        window.onYouTubeIframeAPIReady = function() {
            console.log('YouTube API готов, создаём плеер...');
            try {
                player = new YT.Player('youtube-player', {
                    height: '1',
                    width: '1',
                    playerVars: {
                        'autoplay': 0,
                        'controls': 0,
                        'playsinline': 1,
                        'rel': 0,
                        'modestbranding': 1
                    },
                    events: {
                        'onReady': function() {
                            playerReady = true;
                            console.log('✅ Плеер готов!');
                        },
                        'onStateChange': function(event) {
                            if (event.data === YT.PlayerState.PLAYING) {
                                isPlaying = true;
                                updatePlayBtn();
                                startProgress();
                            } else if (event.data === YT.PlayerState.PAUSED) {
                                isPlaying = false;
                                updatePlayBtn();
                            } else if (event.data === YT.PlayerState.ENDED) {
                                isPlaying = false;
                                updatePlayBtn();
                            }
                        },
                        'onError': function(event) {
                            console.error('YouTube error:', event.data);
                            alert('Ошибка воспроизведения. Открываем в новой вкладке...');
                            if (currentVideoId) {
                                window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Ошибка создания плеера:', error);
            }
        };

        async function performSearch() {
            const q = document.getElementById('search-input').value.trim();
            if (!q || q.length < 2) { alert('Введите минимум 2 символа'); return; }
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;color:white">🔍 Поиск...</div>';
            
            try {
                const res = await fetch(`${API_BASE}/api/youtube/search?q=${encodeURIComponent(q)}&limit=12`);
                const data = await res.json();
                
                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;color:white">😔 Ничего не найдено</div>';
                    return;
                }
                
                let html = '';
                data.items.forEach(item => {
                    const title = escapeHtml(item.title || 'Без названия');
                    const artist = escapeHtml(item.channelTitle || 'Неизвестно');
                    const thumb = item.thumbnail || 'https://via.placeholder.com/300';
                    const videoId = item.videoId;
                    
                    html += `
                        <div class="track-card">
                            <img src="${thumb}" class="track-thumb" loading="lazy">
                            <div class="track-info">
                                <div class="track-title">${title}</div>
                                <div class="track-artist">${artist}</div>
                                <button class="play-btn" onclick="playTrack('${videoId}', '${title.replace(/'/g, "\\'")}', '${artist.replace(/'/g, "\\'")}', '${thumb}')">▶️ Играть</button>
                            </div>
                        </div>
                    `;
                });
                
                resultsDiv.innerHTML = html;
                addXP(5);
            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;color:white">❌ Ошибка поиска</div>';
            }
        }

        function playTrack(videoId, title, artist, thumb) {
            currentVideoId = videoId;
            
            document.getElementById('player-thumb').src = thumb;
            document.getElementById('player-title').textContent = title;
            document.getElementById('player-artist').textContent = artist;
            document.getElementById('player').classList.add('active');
            
            // Пробуем играть через YouTube плеер
            if (playerReady && player && player.loadVideoById) {
                try {
                    player.loadVideoById(videoId);
                    player.playVideo();
                } catch (error) {
                    console.error('Play error:', error);
                    // Fallback - открываем в новой вкладке
                    window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
                }
            } else {
                // Плеер не готов - открываем в новой вкладке
                console.log('Плеер не готов, открываем в новой вкладке...');
                setTimeout(() => {
                    if (playerReady && player && player.loadVideoById) {
                        player.loadVideoById(videoId);
                        player.playVideo();
                    } else {
                        window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank');
                    }
                }, 2000);
            }
            
            played++;
            localStorage.setItem('ss_played', played);
            updateStats();
            addXP(10);
        }

        function togglePlay() {
            if (!player || !playerReady) {
                alert('Плеер загружается...');
                return;
            }
            if (isPlaying) {
                player.pauseVideo();
            } else {
                player.playVideo();
            }
        }

        function skip(seconds) {
            if (!player || !playerReady) return;
            const current = player.getCurrentTime();
            player.seekTo(current + seconds, true);
        }

        function closePlayer() {
            if (player && player.stopVideo) {
                player.stopVideo();
            }
            isPlaying = false;
            document.getElementById('player').classList.remove('active');
            if (progressInterval) { clearInterval(progressInterval); progressInterval = null; }
        }

        function startProgress() {
            if (progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!player || !playerReady) return;
                try {
                    const current = player.getCurrentTime();
                    const duration = player.getDuration();
                    if (duration > 0) {
                        document.getElementById('current-time').textContent = formatTime(current);
                        document.getElementById('total-time').textContent = formatTime(duration);
                        document.getElementById('progress-bar').value = (current / duration) * 100;
                    }
                } catch(e) {}
            }, 1000);
        }

        function formatTime(sec) {
            if (isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2,'0')}`;
        }

        function updatePlayBtn() {
            document.getElementById('play-btn').textContent = isPlaying ? '⏸️' : '▶️';
        }

        function renderLibrary() {
            const list = document.getElementById('library-list');
            if (library.length === 0) {
                list.innerHTML = '<p style="color:white;text-align:center;padding:20px">Библиотека пуста</p>';
                return;
            }
            let html = '';
            library.forEach(item => {
                html += `
                    <div class="library-item" onclick="playTrack('${item.videoId}', '${escapeHtml(item.title)}', '${escapeHtml(item.artist)}', '${item.thumb}')">
                        <img src="${item.thumb}" style="width:60px;height:60px;border-radius:8px;object-fit:cover">
                        <div style="flex:1">
                            <div style="font-weight:600">${escapeHtml(item.title)}</div>
                            <div style="font-size:0.8em;color:#999">${escapeHtml(item.artist)}</div>
                        </div>
                        <div style="font-size:1.5em;color:#667eea">▶️</div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function startSnake() {
            document.getElementById('game-area').style.display = 'block';
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            let snake = [{x:10,y:10}], food = {x:15,y:15}, dx=1, dy=0, score=0;
            
            function draw() {
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,350,350);
                ctx.fillStyle = '#0f0'; snake.forEach(s => ctx.fillRect(s.x*17.5, s.y*17.5, 16, 16));
                ctx.fillStyle = '#f00'; ctx.fillRect(food.x*17.5, food.y*17.5, 16, 16);
                ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.fillText('Счёт: '+score, 10, 25);
            }
            
            function update() {
                const head = {x: snake[0].x+dx, y: snake[0].y+dy};
                if (head.x<0 || head.x>=20 || head.y<0 || head.y>=20 || snake.some(s=>s.x===head.x && s.y===head.y)) {
                    alert('Игра окончена! Счёт: '+score); addXP(score); closeGame(); return;
                }
                snake.unshift(head);
                if (head.x===food.x && head.y===food.y) { score += 10; food = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}; }
                else snake.pop();
                draw();
            }
            
            const interval = setInterval(update, 150);
            draw();
            document.onkeydown = (e) => {
                if (e.key==='ArrowUp' && dy===0) { dx=0; dy=-1; }
                if (e.key==='ArrowDown' && dy===0) { dx=0; dy=1; }
                if (e.key==='ArrowLeft' && dx===0) { dx=-1; dy=0; }
                if (e.key==='ArrowRight' && dx===0) { dx=1; dy=0; }
            };
            window.closeSnake = () => { clearInterval(interval); closeGame(); };
        }

        function start2048() {
            document.getElementById('game-area').style.display = 'block';
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            let grid = Array(4).fill().map(()=>Array(4).fill(0)), score=0;
            
            function addTile() {
                let empty = [];
                for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(grid[i][j]===0) empty.push({i,j});
                if(empty.length>0) { const pos = empty[Math.floor(Math.random()*empty.length)]; grid[pos.i][pos.j] = Math.random()>0.5 ? 2 : 4; }
            }
            
            function draw() {
                ctx.fillStyle = '#000'; ctx.fillRect(0,0,350,350);
                const colors = {0:'#333',2:'#eee',4:'#ddd',8:'#f96',16:'#f63',32:'#f33',64:'#c33',128:'#ff0',256:'#ff0',512:'#ff0',1024:'#ff0',2048:'#ffd700'};
                for(let i=0;i<4;i++) { for(let j=0;j<4;j++) {
                    const val = grid[i][j];
                    ctx.fillStyle = colors[val] || '#000';
                    ctx.fillRect(j*87.5+2.5, i*87.5+2.5, 82.5, 82.5);
                    if(val>0) { ctx.fillStyle = '#000'; ctx.font = 'bold 28px Arial'; ctx.textAlign = 'center'; ctx.fillText(val, j*87.5+43.75, i*87.5+55); }
                }}
                ctx.fillStyle = '#fff'; ctx.font = '18px Arial'; ctx.textAlign = 'left'; ctx.fillText('Счёт: '+score, 10, 25);
            }
            
            addTile(); addTile(); draw();
            document.onkeydown = (e) => {
                let moved = false;
                if(e.key==='ArrowLeft') { for(let i=0;i<4;i++) { for(let j=1;j<4;j++) { if(grid[i][j]!==0) { let k=j; while(k>0 && grid[i][k-1]===0) { grid[i][k-1]=grid[i][k]; grid[i][k]=0; k--; moved=true; } } } } }
                if(moved) { addTile(); draw(); }
            };
        }

        function startGuess() {
            document.getElementById('game-area').style.display = 'block';
            const tracks = library.sort(()=>Math.random()-0.5).slice(0,5);
            let current=0, score=0;
            
            function showQ() {
                if(current>=tracks.length) { alert('Игра окончена! Счёт: '+score); addXP(score*3); closeGame(); return; }
                const track = tracks[current];
                const opts = [track];
                while(opts.length<4) { const r = library[Math.floor(Math.random()*library.length)]; if(!opts.find(o=>o.title===r.title)) opts.push(r); }
                opts.sort(()=>Math.random()-0.5);
                
                const div = document.getElementById('game-area');
                div.innerHTML = `<h3 style="color:white;margin-bottom:15px">Угадай трек #${current+1}/${tracks.length}</h3>
                    <p style="color:white;margin-bottom:15px">Исполнитель: <strong>${track.artist}</strong></p>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:350px;margin:0 auto">
                        ${opts.map(o=>`<button class="nav-btn" onclick="answer('${o.title.replace(/'/g,"\\'")}','${track.title.replace(/'/g,"\\'")}',${score})" style="padding:12px">${o.title}</button>`).join('')}
                    </div>`;
                
                window.answer = (sel, corr, sc) => { if(sel===corr) { sc+=50; alert('✅ Правильно! +50 XP'); } else alert('❌ Неправильно!'); current++; score=sc; showQ(); };
            }
            showQ();
        }

        function closeGame() { document.getElementById('game-area').style.display = 'none'; document.getElementById('game-area').innerHTML = `<canvas id="game-canvas" width="350" height="350" style="background:#000;border-radius:10px;max-width:100%"></canvas><br><br><button class="nav-btn" onclick="closeGame()">❌ Закрыть</button>`; }

        const allAch = [
            {id:'first',name:'Первый трек',desc:'Сыграйте 1 трек',icon:'',cond:()=>played>=1},
            {id:'ten',name:'Меломан',desc:'Сыграйте 10 треков',icon:'🎧',cond:()=>played>=10},
            {id:'hundred',name:'Сотка',desc:'100 XP',icon:'💯',cond:()=>xp>=100},
            {id:'level5',name:'Уровень 5',desc:'Достигните 5 уровня',icon:'⭐',cond:()=>level>=5}
        ];

        function checkAchievements() {
            allAch.forEach(ach => {
                if(!achievements.includes(ach.id) && ach.cond()) {
                    achievements.push(ach.id);
                    coins += 50;
                    alert(`🏆 Достижение: ${ach.name}! +50 `);
                }
            });
            localStorage.setItem('ss_achievements', JSON.stringify(achievements));
            localStorage.setItem('ss_coins', coins);
            updateStats();
        }

        function renderAchievements() {
            const list = document.getElementById('achievements-list');
            let html = '';
            allAch.forEach(ach => {
                const unlocked = achievements.includes(ach.id);
                html += `<div class="achievement ${unlocked?'':'locked'}">
                    <div style="font-size:2em">${ach.icon}</div>
                    <div style="flex:1">
                        <div style="font-weight:600">${ach.name}</div>
                        <div style="font-size:0.8em;color:#999">${ach.desc}</div>
                    </div>
                    <div>${unlocked?'✅':'🔒'}</div>
                </div>`;
            });
            list.innerHTML = html;
        }

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if(!user || !pass) { alert('Заполните все поля'); return; }
            const users = JSON.parse(localStorage.getItem('ss_users') || '{}');
            if(!users[user] || users[user].pass!==pass) { alert('Неверное имя или пароль'); return; }
            currentUser = user;
            localStorage.setItem('ss_user', user);
            showProfile();
            addXP(10);
        }

        function register() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if(!user || !pass) { alert('Заполните все поля'); return; }
            const users = JSON.parse(localStorage.getItem('ss_users') || '{}');
            if(users[user]) { alert('Пользователь существует'); return; }
            users[user] = {pass: pass};
            localStorage.setItem('ss_users', JSON.stringify(users));
            currentUser = user;
            localStorage.setItem('ss_user', user);
            showProfile();
            addXP(50);
            coins += 100;
            updateStats();
        }

        function logout() { currentUser = null; localStorage.removeItem('ss_user'); document.getElementById('auth-form').style.display = 'block'; document.getElementById('profile-data').style.display = 'none'; }

        function showProfile() {
            if(!currentUser) { document.getElementById('auth-form').style.display = 'block'; document.getElementById('profile-data').style.display = 'none'; }
            else {
                document.getElementById('auth-form').style.display = 'none';
                document.getElementById('profile-data').style.display = 'block';
                document.getElementById('profile-name').textContent = currentUser;
                document.getElementById('profile-level').textContent = level;
            }
        }

        function addXP(amount) {
            xp += amount;
            const newLevel = Math.floor(xp/100) + 1;
            if(newLevel > level) { level = newLevel; coins += 100; alert(`🎉 Уровень повышен! Теперь ${level}! +100 🪙`); }
            localStorage.setItem('ss_xp', xp);
            localStorage.setItem('ss_level', level);
            localStorage.setItem('ss_coins', coins);
            updateStats();
            checkAchievements();
        }

        function updateStats() {
            document.getElementById('xp').textContent = xp;
            document.getElementById('level').textContent = level;
            document.getElementById('coins').textContent = coins;
            document.getElementById('played').textContent = played;
        }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            if(id==='library') renderLibrary();
            if(id==='achievements') renderAchievements();
            if(id==='profile') showProfile();
        }

        function escapeHtml(text) { if(!text) return ''; return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

        window.addEventListener('load', () => { updateStats(); console.log('✅ SoundScape Pro загружен!'); });
    </script>
</body>
</html>
